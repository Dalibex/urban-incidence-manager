# Redocly CLI configuration: validation of the OpenAPI contract (docs/api/openapi.yml).
# Used by the `contract` CI job and locally with: npx @redocly/cli@2.71.0 lint
# Conventions behind these rules: docs/api.md.
apis:
  urbanpulse:
    root: docs/api/openapi.yml

extends:
  - recommended

rules:
  # Conventions of docs/api.md turned into errors, so a PR that breaks them turns `contract` red.
  operation-operationId: error
  operation-operationId-unique: error
  operation-tag-defined: error # only the module tags declared at the top of the contract
  operation-singular-tag: error # one module per operation
  operation-4xx-response: error
  operation-4xx-problem-details-rfc7807: error # 4xx bodies are application/problem+json
  paths-kebab-case: error
  # The local server is intentionally http://localhost.
  no-server-example.com: off
  # A warning, not an error: a shared component may be declared before the endpoint that uses it
  # (for example `Conflict`, for the lifecycle actions of Sprint 2).
  no-unused-components: warn
