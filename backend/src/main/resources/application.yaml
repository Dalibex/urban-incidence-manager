spring:
  application:
    name: urbanpulse
  # Locally, the variables of backend/.env (JWT_SECRET...) are read as properties, so the IDE needs
  # no extra setup. Real environment variables win over the file; in a container there is no .env.
  config:
    import: optional:file:.env[.properties]
  # The API answers in English whatever the client's Accept-Language or the language of the machine:
  # without this, bean validation writes its messages in the JVM's language (docs/api.md, "Errors").
  web:
    locale: en
    locale-resolver: fixed
  # One thread per scheduled job: the address worker waits a second between its calls to Nominatim
  # (#375), and with one thread that wait would delay the weather worker too.
  task:
    scheduling:
      pool:
        size: 3
  jpa:
    open-in-view: false
    # SQL is not logged by default (it would also be logged in production). To see it locally,
    # set SPRING_JPA_SHOW_SQL=true in the run configuration.
    show-sql: false
    hibernate:
      ddl-auto: validate

# Every log line of a request starts with its id (RequestIdFilter, X-Request-ID), the same as the
# traceId of its error body, so a report from a user leads to its log lines (Twelve-Factor XI).
logging:
  pattern:
    correlation: "[%X{requestId:-}] "

# Metrics for the load tests (load-tests/practice/README.md). Prometheus reads
# /actuator/prometheus inside the Compose network; the deployment's nginx never proxies /actuator.
# The request histogram gives Grafana the percentiles of every endpoint, not only an average.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

# OpenAPI documentation (ADR-0008, docs/api.md). Swagger UI renders the contract docs/api/openapi.yml,
# copied into the jar at build time; /v3/api-docs is generated from the controllers.
springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yml

# Access tokens (ADR-0004, docs/security.md). Without JWT_SECRET the secret is empty and the
# application does not start (JwtProperties checks it).
urbanpulse:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    # Refresh tokens and rate limits (docs/security.md). The limits are kept in memory: valid with
    # one backend replica only.
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P14D}
    # Expired refresh tokens are deleted once this long has passed since they expired, by a job
    # that runs every day at 03:00 UTC (RefreshTokenCleanup).
    refresh-token-retention: ${REFRESH_TOKEN_RETENTION:P30D}
    sign-in-attempts:
      max: 5
      window: PT15M
    sign-up-attempts:
      max: 10
      window: PT1H
    # Second factor of the staff (#57, ADR-0021, docs/security.md). Without MFA_ENCRYPTION_KEY the
    # application does not start (MfaProperties checks it). An empty MFA_REQUIRED_ROLES asks no role
    # for a code.
    mfa:
      required-roles: ${MFA_REQUIRED_ROLES:MUNICIPAL_OPERATOR,TECHNICIAN,ADMINISTRATOR,ANALYST}
      encryption-key: ${MFA_ENCRYPTION_KEY:}
      issuer: ${MFA_ISSUER:UrbanPulse}
      challenge-ttl: PT5M
      code-attempts-per-challenge: 5
      # Wrong codes per account, kept in memory like the other limits.
      code-attempts:
        max: 10
        window: PT15M
  # The weather of each incident from Open-Meteo, after the report (ADR-0018, docs/deployment.md).
  weather:
    enabled: ${WEATHER_ENRICHMENT_ENABLED:true}
    open-meteo-base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com}
    # Empty: the calls go straight to Open-Meteo.
    open-meteo-proxy: ${OPEN_METEO_PROXY:}
    interval: ${WEATHER_ENRICHMENT_INTERVAL:PT30S}
    batch-size: ${WEATHER_ENRICHMENT_BATCH_SIZE:20}
    open-meteo-timeout: ${OPEN_METEO_TIMEOUT:PT2S}
    max-delay: ${WEATHER_MAX_DELAY:PT1H}
  # The normalized address of each incident from Nominatim, after the report (#375,
  # docs/deployment.md). The public Nominatim allows one call per second and asks for a User-Agent
  # that identifies the application.
  address:
    enabled: ${ADDRESS_ENRICHMENT_ENABLED:true}
    nominatim-base-url: https://nominatim.openstreetmap.org
    # Empty: the calls go straight to Nominatim.
    nominatim-proxy: ${NOMINATIM_PROXY:}
    nominatim-user-agent: UrbanPulse (+https://github.com/Dalibex/urban-incidence-manager)
    interval: PT30S
    batch-size: 10
    request-spacing: PT1S
    nominatim-timeout: PT3S
    # A pending address older than this becomes UNAVAILABLE.
    max-delay: PT24H
  storage:
    # Relative to the working directory: backend/ from the IDE or ./mvnw, /app in the image (#275).
    base-path: ${STORAGE_BASE_PATH:./storage}
    evidence:
      max-file-size: ${EVIDENCE_MAX_FILE_SIZE:10MB}
      max-files-per-incident: ${EVIDENCE_MAX_FILES_PER_INCIDENT:5}
