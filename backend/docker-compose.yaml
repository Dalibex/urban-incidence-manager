# Docker Compose configuration file
# Fixed project name: without it Compose uses the folder name, so moving the folder would create a
# new container and an empty database volume.
name: urbanpulse
services:
  postgres:
    # This service is used to run a Postgres database with PostGIS extension for spatial data support.
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB} # The name of the database to be created when the container starts.
      POSTGRES_USER: ${POSTGRES_USER} # The username for the database.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # The password for the database user.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432" # Port mapping for the Postgres service.
    volumes:
      - postgres-data:/var/lib/postgresql # Volume mapping to persist Postgres data on the host machine. The data will be stored in the "postgres-data" volume.
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      # Used by Spring Boot to automatically configure a connection to the Postgres database.
      org.springframework.boot.service-connection: postgres

  backend:
    # The backend image (backend/Dockerfile). It belongs to the "app" profile, so it only starts with
    # `docker compose --profile app up`: when the backend runs from the IDE, Spring Boot starts this
    # file without profiles and gets only the database (ADR-0011).
    profiles: [app]
    build:
      context: .
      additional_contexts:
        # The build copies the OpenAPI contract into the jar (see backend/Dockerfile).
        contract: ../docs/api
    environment:
      # The jar has no Docker Compose support, so the connection comes from these variables.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Access tokens (docs/security.md). Without JWT_SECRET the backend does not start.
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-P14D}
      REFRESH_TOKEN_RETENTION: ${REFRESH_TOKEN_RETENTION:-P30D}
      # Data profile (docs/datasets.md): empty for no sample data, dev for the development dataset,
      # demo for the demo dataset, which also needs DEMO_PASSWORD (docs/demo.md), perf for the
      # performance dataset, of PERF_INCIDENTS incidents.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      PERF_INCIDENTS: ${PERF_INCIDENTS:-100000}
      # Only read by the one-off process that creates the first administrator (docs/deployment.md):
      #   docker compose --profile app run --rm backend --spring.profiles.include=bootstrap-admin
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Evidence storage policy (ADR-0013)
      STORAGE_BASE_PATH: ${STORAGE_BASE_PATH:-/app/storage}
      EVIDENCE_MAX_FILE_SIZE: ${EVIDENCE_MAX_FILE_SIZE:-10MB}
      EVIDENCE_MAX_FILES_PER_INCIDENT: ${EVIDENCE_MAX_FILES_PER_INCIDENT:-5}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - evidence_data:/app/storage

  tiles-builder:
    # One-off admin process (12-factor XII, ADR-0016) that builds the base map of Málaga. It belongs
    # to the "tiles" profile, so `up` never starts it. Run it by hand (docs/deployment.md):
    #   docker compose --profile tiles run --rm tiles-builder
    profiles: [tiles]
    build: ../tiles
    environment:
      # Where the clients load the tiles, sprites and glyphs from. It is written into style.json.
      TILES_BASE_URL: ${TILES_BASE_URL:-http://localhost:5173/tiles}
    volumes:
      # Output. Until nginx serves the tiles (ADR-0017), the web development server serves this
      # folder, which Git ignores.
      - ../frontend/apps/web/public/tiles:/tiles
      # Downloaded sources (OSM extract, water polygons, Natural Earth), reused between runs.
      - tiles-sources:/data/sources

volumes:
  postgres-data:
  tiles-sources:
  evidence_data:
