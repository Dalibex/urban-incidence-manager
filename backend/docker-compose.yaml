# Docker Compose configuration file
# Fixed project name: without it Compose uses the folder name, so moving the folder would create a
# new container and an empty database volume.
name: urbanpulse
services:
  postgres:
    # This service is used to run a Postgres database with PostGIS extension for spatial data support.
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB} # The name of the database to be created when the container starts.
      POSTGRES_USER: ${POSTGRES_USER} # The username for the database.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # The password for the database user.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432" # Port mapping for the Postgres service.
    volumes:
      - postgres-data:/var/lib/postgresql # Volume mapping to persist Postgres data on the host machine. The data will be stored in the "postgres-data" volume.
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      # Used by Spring Boot to automatically configure a connection to the Postgres database.
      org.springframework.boot.service-connection: postgres

  backend:
    # The backend image (backend/Dockerfile). It belongs to the "app" profile, so it only starts with
    # `docker compose --profile app up`: when the backend runs from the IDE, Spring Boot starts this
    # file without profiles and gets only the database (ADR-0011).
    profiles: [app]
    build:
      context: .
      additional_contexts:
        # The build copies the OpenAPI contract into the jar (see backend/Dockerfile).
        contract: ../docs/api
    environment:
      # The jar has no Docker Compose support, so the connection comes from these variables.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Access tokens (docs/security.md). Without JWT_SECRET the backend does not start.
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-P14D}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
