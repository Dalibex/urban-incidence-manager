# Egress proxy of the deployment Compose (ADR-0011, Amendments). Everything is denied except an
# HTTPS tunnel (CONNECT) from the backend to the external sources it needs. TLS stays end to end
# between the backend and the source: Squid only sees the host name and port, never the content.

http_port 3128

# The backend's fixed address on the internal network (docker-compose.yaml). No other container,
# nor the Docker host through the gateway, may use the proxy. Keep it in step with the Compose
# file; the lint job of the CI checks it.
acl backend src 10.203.217.11/32

# The only destinations: the sources of ADR-0018. A new source is a new line here, in its own
# pull request. -n matches the name asked for and nothing else: without it, a tunnel to an IP
# address would pass when the reverse DNS of that address (which its owner sets) names an allowed
# host, and every such request would leak a DNS lookup.
acl allowed_hosts dstdomain -n api.open-meteo.com

# A destination given as an IP address never names an allowed host: digits and dots (IPv4, or a
# number), or an IPv6 address in brackets. A host name such as cafe.de does not match.
acl ip_literal dstdom_regex -n ^([0-9.]+|\[[0-9a-fA-F:.]+\])$

acl https_port port 443
acl CONNECT method CONNECT

http_access deny !backend
http_access deny !CONNECT
http_access deny !https_port
http_access deny ip_literal
http_access allow allowed_hosts
http_access deny all

# A pure tunnel: no cache and nothing on disk. Inside a CONNECT tunnel Squid adds no header, so the
# source learns nothing about the inside network.
cache deny all

# Logs to the container's output, like every other service (12-factor XI). One line per tunnel:
# time, client, result, bytes and the host:port asked for, never a URL path.
logfile_rotate 0
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr

pid_filename /run/squid/squid.pid
coredump_dir /var/cache/squid
# Docker stops the container with SIGTERM; Squid would otherwise wait 30 s for open tunnels.
shutdown_lifetime 2 seconds
