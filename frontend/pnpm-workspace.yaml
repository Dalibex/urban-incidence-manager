# Client workspace (ADR-0007): two apps and the packages they share.
packages:
  - apps/*
  - packages/*

# openapi-typescript declares TypeScript ^5 as a peer; it works with the 6.0 line that Expo SDK 58
# requires, so the warning is silenced instead of keeping two TypeScript versions.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: '6'

# react-plotly.js declares the whole plotly.js source (about 200 packages) as a peer, which pnpm
# would install. The web passes it the prebuilt basic bundle through `react-plotly.js/factory`, so
# that peer is optional here (#173).
packageExtensions:
  react-plotly.js:
    peerDependenciesMeta:
      plotly.js:
        optional: true

# Install scripts pnpm may run. @parcel/watcher (a Jest dependency) only compiles from source when
# asked to; it uses the prebuilt binary of each platform, so its script is not needed.
allowBuilds:
  '@parcel/watcher': false

# Dependabot alerts #15 (glob) and #17 (minimatch) are fixed only in a major version that Jest,
# ESLint and the Expo tooling do not ask for yet. Only the vulnerable ranges are moved up; remove
# each override once those packages require the fixed version (docs/security.md).
overrides:
  'glob@>=9.0.0 <14.0.2': ^14.0.2
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
