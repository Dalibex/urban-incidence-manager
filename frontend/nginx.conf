# The server of the web image (Dockerfile, ADR-0017), the single entry point of the deployment.
# It replaces /etc/nginx/conf.d/default.conf of the image, whose nginx.conf includes it inside
# http {}.
#
#   /api/                     the backend; the public identity operations with a rate limit
#   /openapi.yml, /swagger-ui.html, /swagger-ui/, /v3/api-docs
#                             the API documentation of the backend, public (docs/security.md)
#   /tiles/                   the base map, from the tiles volume (ADR-0016)
#   /assets/                  the files of the build, named after their content
#   anything else             the web app: a client route such as /inbox gets index.html
#
# The actuator of the backend is not proxied: it stays inside the Compose network.

# The public identity operations (sign-up, sign-in, refresh and password change) answer without a
# token and check a password or a token, so a flood of them is cheap to send and costly to answer.
# Each client address gets 30 a minute, with a burst of 20 at once; past that nginx answers 429
# and the request never reaches the backend. The backend keeps its own limits per email and
# address (docs/security.md); this one only stops floods. 10 MB keep about 160 000 addresses.
limit_req_zone $binary_remote_addr zone=identity:10m rate=30r/m;

# The mime.types of the image has no .mjs, so the worker of MapLibre (/assets/*.mjs) would go out as
# application/octet-stream, and the browser refuses to run a module of that type: the map stays
# empty. At the http {} level this block adds to mime.types; inside server {} it would replace it.
types {
    application/javascript mjs;
}

# The port the client connected to, for X-Forwarded-Port. nginx listens on 8080 inside the
# container, but the client reached HTTP_PORT, and only the Host header carries it; a Host without
# a port means the default port of the scheme.
map $scheme $default_port {
    https   443;
    default 80;
}
map $http_host $forwarded_port {
    "~:(?<host_port>[0-9]+)$"  $host_port;
    default                    $default_port;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # Docker's DNS. The backend is looked up on each request, not once at start-up, so nginx starts
    # and serves the web app while the backend is down or being recreated, and `nginx -t` needs no
    # backend. The lookup is cached for 10 s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # The largest request the backend accepts: EVIDENCE_MAX_FILE_SIZE (10 MB, ADR-0013) plus the
    # 64 KB it leaves for the multipart headers (StorageConfig.java). A larger body gets 413 here
    # and never reaches the backend. When EVIDENCE_MAX_FILE_SIZE changes, change this value too.
    client_max_body_size 10304k;

    # Time limits towards the backend, for every proxied path. A backend that does not accept the
    # connection in 5 s, or stops reading or answering for 30 s, gets 504 instead of holding the
    # client. A stopped backend gets 502 at once.
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Who the client is and which address it used. The backend reads these headers only in the
    # deployment Compose (SERVER_FORWARD_HEADERS_STRATEGY=native) and only from a private address,
    # for the rate limits and the Location of a 201 (docs/security.md). nginx writes every one of
    # them itself, so what the client sent never reaches the backend:
    # - X-Forwarded-For is the end of nginx's own connection, never $proxy_add_x_forwarded_for,
    #   which appends to the value the client sent.
    # - Forwarded (RFC 7239) and X-Forwarded-Prefix are removed: the backend does not read them
    #   with native, but a later switch to server.forward-headers-strategy=framework would make it
    #   trust the client's own values. An empty value means nginx does not send the header.
    # - They stay here, at the server level. nginx drops every proxy_set_header of the server in a
    #   location that sets one of its own, and the client's forged headers would pass again. The
    #   build job of the CI fails if a location sets a proxy_set_header, or if a forged header
    #   reaches the backend (.github/scripts/check_forwarded_headers.sh).
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $forwarded_port;
    proxy_set_header Forwarded          "";
    proxy_set_header X-Forwarded-Prefix "";

    location ~ ^/api/v1/(registrations|sessions|sessions/refresh|password-changes)$ {
        limit_req zone=identity burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $backend;
    }

    location /api/ {
        # Without a path after the address, the request goes on with its own path: /api/v1/...
        proxy_pass $backend;
    }

    location ~ ^/(openapi\.yml|swagger-ui\.html|swagger-ui/|v3/api-docs) {
        proxy_pass $backend;
    }

    # The clients read malaga.pmtiles with Range requests, which nginx answers with 206. The
    # builder replaces the files under the same names, so they are cached for one hour only.
    location /tiles/ {
        alias /srv/tiles/;
        expires 1h;
    }

    # Vite puts a hash of the content in these names, so a new build never reuses one. A missing
    # file is a 404, not the web app.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is checked again on every load, so a new deployment reaches the browser at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
