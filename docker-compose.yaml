# Deployment Compose (ADR-0011, ADR-0017): the whole system on one machine, with nginx (web) as its
# only published port. From the repository root, with .env created from .env.example:
#   docker compose up -d --build
# The guide is docs/deployment.md. Development keeps backend/docker-compose.yaml, which publishes
# the database and the backend on 127.0.0.1 and is never used on a server.
#
# Its own project name, so it never touches the containers and volumes of the development file
# (project urbanpulse) on the same machine.
name: urbanpulse-deploy

# Docker keeps the log of each container in files that otherwise grow until the disk is full: at
# most three files of 10 MB per container. `docker compose logs` reads them.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    # Same image as backend/docker-compose.yaml, the Testcontainers tests and the CI (lint checks it).
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    # No ports: only the backend reaches it, inside the internal network.
    networks: [internal]

  backend:
    build:
      context: backend
      additional_contexts:
        # The build copies the OpenAPI contract into the jar (see backend/Dockerfile).
        contract: docs/api
    restart: unless-stopped
    logging: *logging
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Access tokens (docs/security.md). Without JWT_SECRET the backend does not start.
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-P14D}
      REFRESH_TOKEN_RETENTION: ${REFRESH_TOKEN_RETENTION:-P30D}
      # Data profile (docs/datasets.md): empty in a real deployment, demo for the demo.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      PERF_INCIDENTS: ${PERF_INCIDENTS:-100000}
      # Only read by the one-off process that creates the first administrator (docs/deployment.md):
      #   docker compose run --rm backend --spring.profiles.include=bootstrap-admin
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Evidence storage policy (ADR-0013). frontend/nginx.conf accepts requests of 10 MB plus the
      # multipart headers: change it with EVIDENCE_MAX_FILE_SIZE.
      STORAGE_BASE_PATH: ${STORAGE_BASE_PATH:-/app/storage}
      EVIDENCE_MAX_FILE_SIZE: ${EVIDENCE_MAX_FILE_SIZE:-10MB}
      EVIDENCE_MAX_FILES_PER_INCIDENT: ${EVIDENCE_MAX_FILES_PER_INCIDENT:-5}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - evidence_data:/app/storage
    # Spring Boot waits up to 30 s for the requests in progress on SIGTERM; Docker's default is 10.
    stop_grace_period: 30s
    # No ports: the browser and the phones reach it only through nginx, on /api/ (ADR-0017).
    networks: [internal]

  web:
    build: frontend
    restart: unless-stopped
    logging: *logging
    # The single published port (ADR-0017). Inside the container nginx listens on 8080.
    ports:
      - "${HTTP_PORT:-8000}:8080"
    volumes:
      # The base map that tiles-builder writes. Read-only: nginx only serves it.
      - tiles:/srv/tiles:ro
    depends_on:
      - backend
    # edge publishes the port; internal reaches the backend.
    networks: [edge, internal]

  tiles-builder:
    # One-off admin process (12-factor XII, ADR-0016) that builds the base map into the tiles
    # volume. It belongs to the "tiles" profile, so `up` never starts it (docs/deployment.md):
    #   docker compose --profile tiles run --rm tiles-builder
    profiles: [tiles]
    build: tiles
    logging: *logging
    environment:
      # The public address of the tiles, written into style.json: the entry point plus /tiles.
      TILES_BASE_URL: ${TILES_BASE_URL}
    volumes:
      - tiles:/tiles
      - tiles-sources:/data/sources
    # It downloads the OpenStreetMap data, so it needs the internet, which internal does not give.
    networks: [edge]

networks:
  edge:
  # No published port and no route to the internet (ADR-0011).
  internal:
    internal: true

volumes:
  postgres-data:
  evidence_data:
  tiles:
  tiles-sources:
