# Sets up the client workspace (ADR-0007) for a CI job: pnpm, Node, dependency cache and install.
# Used by the `frontend` and `contract` jobs in ci.yml. Versions are not written here:
#   - pnpm comes from "packageManager" in the workspace package.json
#   - Node comes from the workspace .nvmrc
# so the CI uses exactly what the developers use locally.
name: Set up JS workspace
description: pnpm from packageManager, Node from .nvmrc, pnpm store cache and a frozen install.

inputs:
  directory:
    description: Folder of the client workspace, relative to the repository root (FRONTEND_DIR in ci.yml).
    required: false
    default: frontend

runs:
  using: composite
  steps:
    - name: Set up pnpm (version from packageManager in package.json)
      uses: pnpm/action-setup@v6
      with:
        package_json_file: ${{ inputs.directory }}/package.json

    - name: Set up Node (version from .nvmrc) with pnpm store cache
      uses: actions/setup-node@v7
      with:
        node-version-file: ${{ inputs.directory }}/.nvmrc
        cache: pnpm
        cache-dependency-path: ${{ inputs.directory }}/pnpm-lock.yaml

    # --frozen-lockfile fails if package.json and pnpm-lock.yaml disagree, instead of
    # silently updating the lockfile: the CI installs exactly what is committed.
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: pnpm install --frozen-lockfile
