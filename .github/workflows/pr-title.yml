# Checks that the PR title follows Conventional Commits.
# With squash merging, the PR title becomes the message of the single commit on main,
# so this is what keeps the history of main clean. It also warns when the PR does not
# reference an issue.
# Documentation: docs/ci.md

name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, boilerplate] # TEMPORARY: remove boilerplate before merging into main

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ "$TITLE" =~ $re ]]; then
            echo "Valid title: $TITLE"
          else
            echo "::error title=PR title::'$TITLE' does not follow Conventional Commits. Examples: 'feat: add incident creation endpoint', 'fix(incidents): return 400 on empty title', 'ci: cache maven dependencies'. Edit the title and this check runs again."
            exit 1
          fi

      - name: The PR references an issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?):? +([a-z0-9._-]+/[a-z0-9._-]+)?#[0-9]+'; then
            echo "The PR references at least one issue."
          else
            echo "::warning title=Linked issue::The description does not contain 'Closes #N' / 'Fixes #N'. Every PR should resolve an issue."
          fi
