name: Bug report
description: Reportar un error reproducible
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de abrir el issue, busca si ya existe un bug igual.
        **Si es una vulnerabilidad, no abras un issue público:** sigue `SECURITY.md`.

  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Qué falla, en una o dos frases.
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true

  - type: textarea
    id: evidencias
    attributes:
      label: Evidencias
      description: Logs (sin datos personales ni secretos), respuesta HTTP o traceId. Las capturas puedes pegarlas en el campo de descripción.
      render: text

  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options:
        - local
        - CI
        - staging
        - producción
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión o commit
      placeholder: v0.3.0 o SHA abc1234
    validations:
      required: true

  - type: dropdown
    id: componente
    attributes:
      label: Componente
      multiple: true
      options:
        - backend
        - frontend
        - infra
    validations:
      required: true

  - type: input
    id: navegador
    attributes:
      label: Navegador / SO
      description: Solo si el fallo es de frontend.

  - type: dropdown
    id: job_ci
    attributes:
      label: Job de CI que falla
      options:
        - No aplica
        - lint
        - build
        - test-unit
        - test-integration
        - quality
        - smoke
        - pr-title
        - test-api
        - test-e2e
        - security
        - docker
        - deploy-staging
    validations:
      required: true

  - type: dropdown
    id: gravedad
    attributes:
      label: Gravedad
      options:
        - "Crítica: bloquea un flujo principal o pierde datos"
        - "Alta: funcionalidad importante sin alternativa"
        - "Media: hay alternativa"
        - "Baja: cosmético"
    validations:
      required: true

  - type: input
    id: relacionado
    attributes:
      label: Issue o requisito afectado
      placeholder: "#12, RF09"

  - type: textarea
    id: cierre
    attributes:
      label: Criterios de cierre
      value: |
        - [ ] Existe un test que reproduce el bug y falla antes del arreglo.
        - [ ] El test pasa tras el arreglo (rama `fix/...`, commit `fix: ...`).
        - [ ] Los jobs de CI afectados están en verde.
    validations:
      required: true
