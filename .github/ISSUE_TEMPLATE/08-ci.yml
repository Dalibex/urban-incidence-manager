name: CI/CD
description: Create or change GitHub Actions workflows
title: "[CI]: "
labels: ["ci"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      multiple: true
      options:
        - .github/workflows/ci.yml
        - .github/workflows/pr-title.yml
        - .github/actions/setup-js/action.yml
        - .github/scripts/ci_summary.py
        - New workflow (name it in the description)
    validations:
      required: true

  - type: dropdown
    id: jobs
    attributes:
      label: Affected jobs
      multiple: true
      options:
        - detect
        - lint
        - build
        - test-unit
        - test-integration
        - quality
        - smoke
        - contract
        - frontend
        - test
        - pr-title
        - test-e2e
        - security
        - docker
        - deploy-staging
        - New job (describe it in Proposed changes)
    validations:
      required: true

  - type: dropdown
    id: triggers
    attributes:
      label: Triggers
      multiple: true
      options:
        - pull_request to main
        - push to main
        - Tag / release
        - Scheduled (schedule)
        - Manual (workflow_dispatch)
    validations:
      required: true

  - type: textarea
    id: proposed_changes
    attributes:
      label: Proposed changes
    validations:
      required: true

  - type: dropdown
    id: main_protection
    attributes:
      label: Impact on main branch protection
      options:
        - No impact
        - Adds a required status check
        - Removes or renames a required status check (warn the team before merging)
    validations:
      required: true

  - type: textarea
    id: secrets
    attributes:
      label: Secrets and permissions
      description: GitHub secrets needed (name only, never the value) and GITHUB_TOKEN permissions.
      placeholder: "- None"

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] The workflow passes on a test PR. [CI: <job>]
        - [ ] A PR with a deliberate failure is blocked. [Manual]
        - [ ] Acceptable run time: < 10 min. [Review]
        - [ ] `docs/ci.md` updated. [Review]
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      value: |
        - Depends on: #
        - Unblocks: #
