# UrbanPulse REST API contract (ADR-0008, contract first).
#
# This file is the source of truth for the API: the backend implements it and the clients generate
# their types from it. The contract of a feature is merged before or together with its
# implementation, never after it: the Sprint 1 operations were agreed ahead in #93 and the committed
# Sprint 2 ones in #204, and a later feature writes its contract first. An operation that is not
# built yet says `Planned: #N`, naming the issue that implements it, whose pull request removes the
# mark. How to do it: docs/api.md.
openapi: 3.1.0

info:
  title: UrbanPulse API
  version: 0.1.0
  summary: Cloud platform for the intelligent management of urban incidents.
  description: |
    REST API shared by the UrbanPulse web and mobile clients.

    - **Authentication:** every operation requires a JWT access token in the
      `Authorization: Bearer <token>` header (ADR-0004). Public operations opt out explicitly
      with `security: []`.
    - **Errors:** every error is returned as `application/problem+json`
      ([RFC 9457](https://www.rfc-editor.org/rfc/rfc9457)) with the `Problem` schema. Clients
      branch on `status` and `code`, never on the text of `detail`.
    - **Request id:** every response, successful or not, carries an `X-Request-ID` header, and
      every `Problem` repeats it as `traceId`; the backend writes it in the log lines of the
      request. A client may send its own `X-Request-ID` (1 to 64 letters, digits, `.`, `_` or
      `-`); any other value is replaced by a generated one.
    - **Formats:** JSON with `camelCase` properties, instants in UTC (ISO 8601) and coordinates in
      WGS 84 (EPSG:4326), always as separate `latitude` and `longitude` properties.
    - **Listings:** paginated with `page`, `size` and `sort`; the response carries `content` and
      a `page` object.

    Conventions and the steps to add an endpoint are in `docs/api.md`.
  license:
    name: Apache 2.0
    identifier: Apache-2.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local backend (./mvnw spring-boot:run or the development compose)
  - url: /api/v1
    description: Same origin as the page showing the docs (Swagger UI served by the backend or a reverse proxy)
  # Staging is added here when the environment exists.

# Applied to every operation. A public operation (login, sign-up, refresh) overrides it with
# `security: []`.
security:
  - bearerAuth: []

# One tag per backend module (ADR-0010). Every operation has exactly one of these tags, the one of
# the module that implements it. `shared` is not a module and has no tag.
tags:
  - name: identity
    description: Users, roles and permissions; sign-up, login and token refresh; audit log.
  - name: incidents
    description: >-
      Incident reporting, categories, priority, lifecycle and status history, assignments,
      comments and evidence.
  - name: geospatial
    description: Districts, neighbourhoods, urban assets and spatial queries.
  - name: urbancontext
    description: >-
      External urban context (Open Data Málaga, OpenStreetMap, weather and traffic) and the
      enrichment of incidents.
  - name: notifications
    description: Notifications created on incident changes and their delivery status.
  - name: analytics
    description: Read-only indicators, zone analysis and reports.

paths:
  # --- identity (#35) ---------------------------------------------------------------------------

  /registrations:
    post:
      tags: [identity]
      operationId: createRegistration
      summary: Sign up as a citizen
      description: |
        Creates a citizen account. The new user always gets the `CITIZEN` role: a `role` sent in
        the body is ignored. Staff accounts are created by an administrator, not here. The
        response does not sign the user in; the client calls `createSession` afterwards.

        `EMAIL_ALREADY_EXISTS` reveals that an email has an account, so sign-up is rate limited
        like sign-in, to keep anyone from checking many emails.

        Roles: public.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRegistrationRequest"
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: "An account with this email already exists. Code: `EMAIL_ALREADY_EXISTS`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: about:blank
                title: Conflict
                status: 409
                code: EMAIL_ALREADY_EXISTS
                detail: An account with this email already exists.
                instance: /api/v1/registrations
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /sessions:
    post:
      tags: [identity]
      operationId: createSession
      summary: Sign in
      description: |
        Checks the email and password and returns a new token pair (ADR-0004). Repeated failed
        attempts are rate limited.

        A wrong email and a wrong password get the same `401`, so sign-in does not reveal which
        emails have an account (sign-up does, with `EMAIL_ALREADY_EXISTS`). `ACCOUNT_DISABLED` is
        only returned when the password is right.

        `PASSWORD_CHANGE_REQUIRED` is also only returned when the password is right, so a wrong
        password does not reveal that an account has to change it. The client then calls
        `createPasswordChange` and signs in again. Planned: #165.

        Roles: public.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Signed in. The body holds the new token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: "The email or the password is wrong. Code: `INVALID_CREDENTIALS`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: INVALID_CREDENTIALS
                detail: The email or the password is not correct.
                instance: /api/v1/sessions
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        "403":
          description: >-
            The credentials are right but no session can start: the account is disabled, code
            `ACCOUNT_DISABLED`, or its password must change first, code `PASSWORD_CHANGE_REQUIRED`
            (planned: #165).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                accountDisabled:
                  summary: The account is disabled
                  value:
                    type: about:blank
                    title: Forbidden
                    status: 403
                    code: ACCOUNT_DISABLED
                    detail: This account is disabled.
                    instance: /api/v1/sessions
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                passwordChangeRequired:
                  summary: The password must change first
                  value:
                    type: about:blank
                    title: Forbidden
                    status: 403
                    code: PASSWORD_CHANGE_REQUIRED
                    detail: Change your password before signing in.
                    instance: /api/v1/sessions
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /sessions/refresh:
    post:
      tags: [identity]
      operationId: refreshSession
      summary: Renew the token pair
      description: |
        Exchanges a refresh token for a new token pair. The refresh token is rotated: the one sent
        stops working. Sending a revoked refresh token again (already used, or signed out) before
        it expires fails and also revokes every session of its user, because someone else may hold
        a copy of it. The answer does not say whether the token was reused, expired or unknown.

        A client must not try to refresh again when this operation returns `401`: it signs the
        user out instead.

        Roles: public (the refresh token is the credential).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: The new token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: >-
            The refresh token is unknown, expired, revoked or already used, or the account is
            disabled. Code: `INVALID_REFRESH_TOKEN`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: INVALID_REFRESH_TOKEN
                detail: The session has expired. Sign in again.
                instance: /api/v1/sessions/refresh
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /sessions/current:
    delete:
      tags: [identity]
      operationId: deleteCurrentSession
      summary: Sign out
      description: |
        Revokes the refresh token of the session the access token belongs to: the access token
        carries the id of the refresh token issued with it. Other sessions of the same user (other
        devices) stay open. The access token keeps working until it expires (about 15 minutes,
        ADR-0004), so the client discards both tokens.

        It is idempotent: a session that is already revoked also returns `204`. If the access
        token has expired, the client refreshes first and then signs out, so the refresh token
        does not stay valid on the device.

        Roles: any authenticated user.
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /password-changes:
    post:
      tags: [identity]
      operationId: createPasswordChange
      summary: Change the password with the current one
      description: |
        Planned: #165.

        Replaces the password, clears the obligation to change it, revokes every refresh token of
        the user and records a `CHANGE_PASSWORD` audit entry without any password, in one
        transaction. It is public because an account that must change its password has no tokens
        yet, so the current password is the credential. It works for every account, whether it is
        obliged to change the password or not.

        A wrong current password and an unknown email get the same `401`, in a comparable time, so
        this operation does not reveal which emails have an account. Failed attempts are rate
        limited like sign-in. Of two changes at once with the same current password, one succeeds
        and the other gets `401`.

        Roles: public.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePasswordChangeRequest"
      responses:
        "204":
          description: The password changed. The client signs in with the new one.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: "The email or the current password is wrong. Code: `INVALID_CREDENTIALS`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: INVALID_CREDENTIALS
                detail: The email or the password is not correct.
                instance: /api/v1/password-changes
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        "403":
          description: "The credentials are right but the account is disabled. Code: `ACCOUNT_DISABLED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: about:blank
                title: Forbidden
                status: 403
                code: ACCOUNT_DISABLED
                detail: This account is disabled.
                instance: /api/v1/password-changes
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/me:
    get:
      tags: [identity]
      operationId: getCurrentUser
      summary: Get the signed-in user
      description: |
        Profile and role of the user the access token belongs to. The clients use `role` to choose
        the landing screen; the API checks the role again in every operation.

        Roles: any authenticated user.
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # --- identity: user management (#40) ----------------------------------------------------------

  /users:
    get:
      tags: [identity]
      operationId: listUsers
      summary: List the users
      description: |
        Planned: #191.

        Paginated users of every role, enabled or not.

        Sortable properties: `name`, `email`. Default `name,asc`; `id` is always added as the last
        criterion so the order is stable between pages.

        Roles: `ADMINISTRATOR`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
        - name: name
          in: query
          description: Only users whose name contains this text, ignoring case.
          schema:
            type: string
            examples: [martín]
        - name: email
          in: query
          description: Only users whose email contains this text, ignoring case.
          schema:
            type: string
            examples: ["@example.com"]
        - name: role
          in: query
          description: >-
            Only users with one of these roles. Repeat it for several values
            (`?role=TECHNICIAN&role=ANALYST`). Absent means every role.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Role"
          style: form
          explode: true
      responses:
        "200":
          description: One page of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [identity]
      operationId: createUser
      summary: Create a staff account
      description: |
        Planned: #191.

        Creates an enabled staff account with the initial password the administrator typed. The
        user must change it at the first sign-in (#165). Citizens sign up by themselves, so the
        role `CITIZEN` returns `422`. It records a `CREATE_USER` audit entry.

        Roles: `ADMINISTRATOR`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The account was created. `Location` points to it and the body repeats it.
          headers:
            Location:
              description: URL of the new user.
              schema:
                type: string
                format: uri-reference
                examples: [/api/v1/users/7c2e4b1a-9d3f-4e8a-b6c5-1f0a2d3e4b5c]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "An account with this email already exists. Code: `EMAIL_ALREADY_EXISTS`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: about:blank
                title: Conflict
                status: 409
                code: EMAIL_ALREADY_EXISTS
                detail: An account with this email already exists.
                instance: /api/v1/users
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userId}:
    get:
      tags: [identity]
      operationId: getUser
      summary: Get a user
      description: |
        Planned: #191.

        Roles: `ADMINISTRATOR`.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags: [identity]
      operationId: updateUser
      summary: Change the name or role of a user, or disable or enable the account
      description: |
        Planned: #191.

        Only the properties present in the body change. There is no `DELETE`: users are referenced
        by incidents, history and the audit trail, so an account is disabled instead.

        A role change or a disabled account takes effect at the next refresh. Disabling revokes the
        refresh tokens of the user in the same transaction. Each kind of change records its audit
        entry (`UPDATE_USER`, `CHANGE_ROLE`, `DISABLE_USER`, `ENABLE_USER`); a name change records
        which field changed, never its value.

        Administrators cannot change their own role or disable themselves: it returns `422`. Of two
        changes at once, both apply one after the other.

        Roles: `ADMINISTRATOR`.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The user after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /technicians:
    get:
      tags: [identity]
      operationId: listTechnicians
      summary: List the active technicians
      description: |
        Planned: #190.

        Enabled technicians, ordered by name, for the assignment form. It is a short list of staff,
        so it is not paginated. It returns only what the form needs, without emails.

        Roles: `MUNICIPAL_OPERATOR`, `ADMINISTRATOR`.
      responses:
        "200":
          description: The enabled technicians.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TechnicianSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # --- identity: audit trail (#41) --------------------------------------------------------------

  /audit-entries:
    get:
      tags: [identity]
      operationId: listAuditEntries
      summary: List the audit trail
      description: |
        Planned: #41.

        Paginated entries of the audit trail (RF18): who did what, when and on which record. The
        trail is append-only, so this collection has no operation to create, change or delete an
        entry; entries are written by the operations they record (docs/security.md).

        `actor.name` and `target.label` are read when the listing is requested, not when the entry
        was written: a user renamed later shows their current name.

        Sortable property: `instant`. Default `instant,desc` (newest first); `id` is always added as
        the last criterion so the order is stable between pages.

        Roles: `ADMINISTRATOR`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
        - name: from
          in: query
          description: >-
            Only entries at or after this instant (UTC, included). Together with `to` it must be
            earlier than `to`, or the request returns `400`.
          schema:
            type: string
            format: date-time
            examples: ["2026-11-01T00:00:00Z"]
        - name: to
          in: query
          description: >-
            Only entries before this instant (UTC, excluded), so consecutive ranges
            (`to` of one equal to `from` of the next) never count an entry twice.
          schema:
            type: string
            format: date-time
            examples: ["2026-11-02T00:00:00Z"]
        - name: actorId
          in: query
          description: Only entries made by this user.
          schema:
            type: string
            format: uuid
            examples: [7c2e4b1a-9d3f-4e8a-b6c5-1f0a2d3e4b5c]
        - name: action
          in: query
          description: >-
            Only entries of one of these actions. Repeat it for several values
            (`?action=CREATE_USER&action=CHANGE_ROLE`). Absent means every action.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AuditAction"
          style: form
          explode: true
      responses:
        "200":
          description: One page of audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # --- incidents (#37, #43) ---------------------------------------------------------------------

  /categories:
    get:
      tags: [incidents]
      operationId: listCategories
      summary: List the active categories
      description: |
        Active categories, ordered by name, for the category drop-down of the report form. It is a
        short reference list managed by administrators, so it is not paginated.

        Roles: any authenticated user.
      responses:
        "200":
          description: The active categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /incidents:
    get:
      tags: [incidents]
      operationId: listIncidents
      summary: List the incidents the user can see
      description: |
        Paginated incidents, scoped by role (#37):

        - `CITIZEN`: only the incidents they reported.
        - `TECHNICIAN`: only the incidents actively assigned to them.
        - `MUNICIPAL_OPERATOR`, `ADMINISTRATOR`: all incidents.
        - `ANALYST`: no access yet (`403`); analytics comes in a later milestone.

        Sortable properties: `reportedAt`, `updatedAt`. Default `reportedAt,desc` (newest first);
        `id` is always added as the last criterion so the order is stable between pages.

        Filters always apply inside what the caller may see, so they never widen it, and every
        filter used must match. `status` is open to every role that can list. The other filters are
        for staff: a `CITIZEN` who uses one gets `403`. An unknown parameter, or one without a value
        (`?categoryId=`), returns `400`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/CategoryIdFilter"
        - $ref: "#/components/parameters/PriorityFilter"
        - $ref: "#/components/parameters/ReportedFromFilter"
        - $ref: "#/components/parameters/ReportedToFilter"
        - $ref: "#/components/parameters/DepartmentIdFilter"
      responses:
        "200":
          description: One page of incidents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [incidents]
      operationId: createIncident
      summary: Report an incident
      description: |
        Creates an incident in `REPORTED` status with its first history entry, in one transaction
        (#37, ADR-0020). The reporter is the user of the access token, never a property of the
        body.

        No external source is called while reporting (RF26): `address`, `neighborhood` and
        `district` start as `null` ("not available yet") and are filled in later, when enrichment
        exists.

        Roles: `CITIZEN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIncidentRequest"
      responses:
        "201":
          description: The incident was created. `Location` points to it and the body repeats it.
          headers:
            Location:
              description: URL of the new incident.
              schema:
                type: string
                format: uri-reference
                examples: [/api/v1/incidents/3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /incidents/{incidentId}:
    get:
      tags: [incidents]
      operationId: getIncident
      summary: Get an incident
      description: |
        The incident, if the user may see it under the rules of `listIncidents`. An incident the
        user may not see returns `404`, the same as one that does not exist, so its existence is
        not revealed (#37).

        Roles: `CITIZEN` (own incidents), `TECHNICIAN` (actively assigned), `MUNICIPAL_OPERATOR`,
        `ADMINISTRATOR`. `ANALYST` gets `403`.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: The incident.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags: [incidents]
      operationId: updateIncident
      summary: Classify an incident
      description: |
        Sets or corrects the category and the priority; send at least one of them. It is not a
        lifecycle action, so it adds no history entry: each change records a `CLASSIFY_INCIDENT`
        audit entry with the previous and new values, in the same transaction. The server records
        the actor and the source `MANUAL` of the priority.

        A priority needs its justification in `priorityReason`, or the request returns `422`.

        `409` with `CONCURRENT_MODIFICATION` if `version` is stale, or with
        `CLASSIFICATION_NOT_ALLOWED` if the incident is `REJECTED` or `CLOSED`. Nothing changes.

        Roles: `MUNICIPAL_OPERATOR`, `ADMINISTRATOR`.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIncidentRequest"
      responses:
        "200":
          description: The incident after the change, with its new `version`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /incidents/{incidentId}/classification-changes:
    get:
      tags: [incidents]
      operationId: listIncidentClassificationChanges
      summary: List the classification changes of an incident
      description: |
        The category and priority changes of one incident, for the timeline of its detail. They are
        not status changes, so they are not in `listIncidentStatusChanges` (ADR-0020). This operation
        reads the `CLASSIFY_INCIDENT` entries of the audit trail: the same records as
        `listAuditEntries`, with no second copy, shown for another purpose. It exposes nothing else
        from the trail.

        Category names are read when the listing is requested. Each change holds only the values
        that changed.

        Sortable property: `instant`. Default `instant,asc` (oldest first, as the history); `id` is
        always added as the last criterion so the order is stable between pages. An incident never
        classified returns `200` with an empty page.

        Roles: `MUNICIPAL_OPERATOR`, `ADMINISTRATOR`, `TECHNICIAN` (actively assigned; any other
        technician gets `404`). `CITIZEN` and `ANALYST` get `403`.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: One page of classification changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationChangePageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # --- incidents: lifecycle actions (ADR-0020) ---------------------------------------------------
  # Each one is checked in the order of ADR-0020: role (403), incident the caller can see (404),
  # stale version (409 CONCURRENT_MODIFICATION), transition (409 INVALID_TRANSITION), data (422).
  # Each one answers 200 with the incident, so the client has the version for its next action.

