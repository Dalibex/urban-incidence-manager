  # --- incidents: evidence (#44, ADR-0013) -------------------------------------------------------

  /incidents/{incidentId}/attachments:
    get:
      tags: [incidents]
      operationId: listIncidentAttachments
      summary: List the photos of an incident
      description: |
        Metadata of the photos, oldest first. The limit of files per incident bounds it, so it is not
        paginated. It never holds a storage key or a public URL: the file is read with
        `getAttachmentContent`, after authorisation.

        Roles: `CITIZEN` (own incidents), `TECHNICIAN` (actively assigned), `MUNICIPAL_OPERATOR`,
        `ADMINISTRATOR`. An incident the user may not see returns `404`. `ANALYST` gets `403`.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: The metadata of the photos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttachmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [incidents]
      operationId: createIncidentAttachment
      summary: Upload a photo to an incident
      description: |
        One JPEG, PNG or WebP photo per request. The type is detected from the content, never from
        the file name or the declared `Content-Type`. The size and the number of files per incident
        come from configuration (`EVIDENCE_MAX_FILE_SIZE`, `EVIDENCE_MAX_FILES_PER_INCIDENT`).

        A file over the size limit returns `413`. Another type, or too many files, returns `422`.

        The same content uploaded again to the same incident, such as a retry, stores nothing new
        and returns `200` with the existing attachment, so a client can retry safely.

        If the storage fails, it returns `500`, no attachment is recorded and the incident stays as
        it was.

        Roles: `CITIZEN` (own incidents, only while `REPORTED`; later it returns `409` with the code
        `ATTACHMENT_NOT_ALLOWED`), `TECHNICIAN` (actively assigned), `MUNICIPAL_OPERATOR`,
        `ADMINISTRATOR`. An incident the user may not see returns `404`. `ANALYST` gets `403`.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateAttachmentRequest"
      responses:
        "200":
          description: This content was already attached to the incident. Nothing new was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentResponse"
        "201":
          description: The photo was stored. `Location` points to its content.
          headers:
            Location:
              description: URL of the content of the new attachment.
              schema:
                type: string
                format: uri-reference
                examples: [/api/v1/attachments/c4d5e6f7-a8b9-4c0d-9e1f-2a3b4c5d6e7f/content]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /attachments/{attachmentId}/content:
    get:
      tags: [incidents]
      operationId: getAttachmentContent
      summary: Download a photo
      description: |
        The file, with the type detected when it was uploaded. An opaque identifier does not replace
        authorisation: the same rules as `listIncidentAttachments` apply to the incident of the
        attachment, with the same `404` rule.

        Roles: the same as `listIncidentAttachments`.
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: The file.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # --- incidents: reference data and map ---------------------------------------------------------

  /departments:
    get:
      tags: [incidents]
      operationId: listDepartments
      summary: List the active departments
      description: |
        Active departments, ordered by name, for the assignment form and the staff filters. It is a
        short reference list managed by administrators, so it is not paginated.

        Roles: `MUNICIPAL_OPERATOR`, `TECHNICIAN`, `ADMINISTRATOR`.
      responses:
        "200":
          description: The active departments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /incident-locations:
    get:
      tags: [incidents]
      operationId: listIncidentLocations
      summary: List the positions of incidents for the map
      description: |
        A lightweight list for the map, with the same filters and the same scope as `listIncidents`
        and an optional bounding box (#195). It is not paginated, because the map needs one answer
        for the whole view: the server returns at most 1,000 items, puts the most relevant first
        (priority from `HIGH` to none, then newest) and sets `truncated` when it left some out. An
        empty result is `200`. An unknown parameter, or one without a value, returns `400`, like
        `listIncidents`.

        The bounding box takes all four parameters or none, and its edges are included. It uses named
        limits instead of a list of four numbers, so its order cannot be mistaken. A minimum over its
        maximum, a value out of range or only some of the four returns `400`. A box across the antimeridian is not supported:
        the service covers Málaga.

        These data are live and are not cached.

        Roles: `MUNICIPAL_OPERATOR`, `ADMINISTRATOR` (every incident), `TECHNICIAN` (active
        assignments). `CITIZEN` and `ANALYST` get `403`.
      parameters:
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/CategoryIdFilter"
        - $ref: "#/components/parameters/PriorityFilter"
        - $ref: "#/components/parameters/ReportedFromFilter"
        - $ref: "#/components/parameters/ReportedToFilter"
        - $ref: "#/components/parameters/DepartmentIdFilter"
        - name: minLatitude
          in: query
          description: South limit of the bounding box, WGS 84 latitude in decimal degrees.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
            examples: [36.68]
        - name: minLongitude
          in: query
          description: West limit of the bounding box, WGS 84 longitude in decimal degrees.
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
            examples: [-4.52]
        - name: maxLatitude
          in: query
          description: North limit of the bounding box, WGS 84 latitude in decimal degrees.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
            examples: [36.76]
        - name: maxLongitude
          in: query
          description: East limit of the bounding box, WGS 84 longitude in decimal degrees.
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
            examples: [-4.34]
      responses:
        "200":
          description: The positions, the most relevant first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentLocationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # --- analytics (#42) ---------------------------------------------------------------------------

  /incident-reports:
    get:
      tags: [analytics]
      operationId: getIncidentReport
      summary: Get an operational report of incidents
      description: |
        Incidents reported in the period, counted with their current status and grouped by
        `groupBy`. `Accept: application/json` returns it for the screen and `Accept: text/csv` as a
        file with the same rows; without `Accept`, or with `*/*`, it is JSON. Errors stay
        `application/problem+json` in both cases.

        `from`, `to` and `groupBy` are required, once each: one that is missing, repeated or empty,
        a date-time without its UTC offset or outside the years 1 to 9999, or an unknown parameter
        is a `400`. A role that may not read reports gets `403` before any of these checks.
        `from` must be earlier than `to` and the period may not exceed 366 days, or the request
        returns `422` with the error on the field `to`. A period without incidents returns `200`
        with no rows, and a CSV with only its header.

        It holds no personal data. In the CSV, a group that is not available says `Not available`,
        a missing percentile is an empty cell, decimals use a dot, lines end in CRLF, the encoding is
        UTF-8 with a BOM, and a text cell starting with `=`, `+`, `-`, `@`, a tab or a carriage
        return is escaped with a leading `'`. Status and priority groups use the values of the API
        (`IN_PROGRESS`), not the labels of a screen.

        Roles: `ANALYST`, `ADMINISTRATOR`.
      parameters:
        - name: from
          in: query
          required: true
          description: Start of the period (UTC, included).
          schema:
            type: string
            format: date-time
            examples: ["2026-10-01T00:00:00Z"]
        - name: to
          in: query
          required: true
          description: End of the period (UTC, excluded).
          schema:
            type: string
            format: date-time
            examples: ["2026-11-01T00:00:00Z"]
        - name: groupBy
          in: query
          required: true
          description: How to group the rows. An unknown value returns `400`.
          schema:
            $ref: "#/components/schemas/IncidentReportGrouping"
      responses:
        "200":
          description: The report.
          headers:
            Content-Disposition:
              description: Only with `text/csv`, so the browser downloads the file.
              schema:
                type: string
                examples: ['attachment; filename="incident-report.csv"']
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentReportResponse"
            text/csv:
              schema:
                type: string
              example: |
                group,total,open,closed,rejected,resolutionHoursP50,resolutionHoursP95
                Street lighting,12,5,6,1,18.5,40.25
                Not available,3,3,0,0,,
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # --- incidents: status history (#37) -----------------------------------------------------------

  /incidents/{incidentId}/status-changes:
    get:
      tags: [incidents]
      operationId: listIncidentStatusChanges
      summary: Get the status history of an incident
      description: |
        Every status change of the incident, oldest first. It is not paginated: the lifecycle of
        ADR-0020 bounds it to a few entries per incident.

        A citizen only gets the entries visible to them, with the reason only where ADR-0020 says
        the citizen sees it, and without the staff-only properties. Staff get every entry.

        Roles: the same as `getIncident`, with the same `404` rule.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: The status history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusChangeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Short-lived JWT access token (about 15 minutes) issued by the API and renewed with a
        rotating refresh token (ADR-0004).

  parameters:
    IncidentId:
      name: incidentId
      in: path
      required: true
      description: Identifier of the incident.
      schema:
        type: string
        format: uuid
        examples: [3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e]

    UserId:
      name: userId
      in: path
      required: true
      description: Identifier of the user.
      schema:
        type: string
        format: uuid
        examples: [7c2e4b1a-9d3f-4e8a-b6c5-1f0a2d3e4b5c]

    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: Identifier of the attachment.
      schema:
        type: string
        format: uuid
        examples: [c4d5e6f7-a8b9-4c0d-9e1f-2a3b4c5d6e7f]

    StatusFilter:
      name: status
      in: query
      description: >-
        Only incidents in one of these statuses. Repeat it for several values
        (`?status=REPORTED&status=VALIDATED`). Absent means every status.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/IncidentStatus"
      style: form
      explode: true

    CategoryIdFilter:
      name: categoryId
      in: query
      description: Only incidents in one of these categories. Repeat it for several values.
      schema:
        type: array
        items:
          type: string
          format: uuid
          examples: [a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d]
      style: form
      explode: true

    PriorityFilter:
      name: priority
      in: query
      description: Only incidents with one of these priorities. Repeat it for several values.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/Priority"
      style: form
      explode: true

    ReportedFromFilter:
      name: reportedFrom
      in: query
      description: >-
        Only incidents reported at or after this instant (included). An RFC 3339 date-time with its
        offset (`Z` for UTC; `+` encoded as `%2B` in the URL); without an offset it returns `400`.
        It must be earlier than `reportedTo`, or the request returns `400`.
      schema:
        type: string
        format: date-time
        examples: ["2026-11-01T00:00:00Z"]

    ReportedToFilter:
      name: reportedTo
      in: query
      description: >-
        Only incidents reported before this instant (excluded). The same format as `reportedFrom`.
      schema:
        type: string
        format: date-time
        examples: ["2026-11-08T00:00:00Z"]

    DepartmentIdFilter:
      name: departmentId
      in: query
      description: >-
        Only incidents whose active assignment is in one of these departments. Repeat it for several
        values. A previous assignment does not count.
      schema:
        type: array
        items:
          type: string
          format: uuid
          examples: [d1e2f3a4-b5c6-4d7e-8f9a-0b1c2d3e4f5a]
      style: form
      explode: true

    Page:
      name: page
      in: query
      description: Page number, starting at 0.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

    Size:
      name: size
      in: query
      description: Items per page. A value over 100 returns `400`; it is never silently reduced.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

    Sort:
      name: sort
      in: query
      description: >-
        Sort criterion as `property,asc` or `property,desc`. Each listing documents the properties
        it accepts and its default; an unknown property returns `400`.
      schema:
        type: string
        pattern: "^[a-zA-Z]+,(asc|desc)$"
        examples: ["reportedAt,desc"]

  headers:
    XRequestId:
      description: >-
        Id of the request, the same as `traceId` in an error body and in the backend logs. The
        client's own `X-Request-ID` when it was 1 to 64 letters, digits, `.`, `_` or `-`, otherwise
        a generated one.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"
        examples: [4bf92f3577b34da6a3ce929d0e0e4736]

    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
        minimum: 1
        examples: [60]

  schemas:
    Problem:
      type: object
      description: >-
        Error body for every 4xx and 5xx response (RFC 9457 Problem Details). Clients must not
        parse `detail`, which is for humans; they branch on `status` and, when present, `code`.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: >-
            Identifies the kind of problem. `about:blank` when the HTTP status says it all.
          default: about:blank
          examples: [about:blank]
        title:
          type: string
          description: Short, human-readable summary of the kind of problem.
          examples: [Not Found]
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          description: HTTP status code, repeated in the body.
          examples: [404]
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
          description: >-
            Stable, machine-readable reason, for the cases where the status alone is not enough
            for the client (for example `INVALID_CREDENTIALS` and `ACCOUNT_DISABLED`). Once
            published, a code never changes its meaning. The catalogue is in `docs/api.md`.
          examples: [EMAIL_ALREADY_EXISTS]
        detail:
          type: string
          description: >-
            Explanation of this occurrence. Never contains stack traces, SQL or personal data.
          examples: [Incident 3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e does not exist.]
        instance:
          type: string
          format: uri-reference
          description: Request path where the problem happened.
          examples: [/api/v1/incidents/3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e]
        traceId:
          type: string
          description: >-
            Id of the request, equal to its `X-Request-ID` response header and written in its log
            lines, so a report from a user can be matched with the server side.
          examples: [4bf92f3577b34da6a3ce929d0e0e4736]
        errors:
          type: array
          description: Only in `422` responses, one item per invalid field.
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      description: One invalid field of the request.
      required: [field, message]
      properties:
        field:
          type: string
          description: Path of the invalid property in the request body, or name of the parameter.
          examples: [location.latitude]
        message:
          type: string
          description: Why the value is not valid.
          examples: [must be between -90 and 90]

    PageMetadata:
      type: object
      description: Position of a page inside a paginated listing.
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
          format: int32
          minimum: 0
          description: Number of this page, starting at 0.
          examples: [0]
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Requested page size. The last page may hold fewer items.
          examples: [20]
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: Items in the whole listing with the current filters.
          examples: [1]
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: Pages in the whole listing with the current filters.
          examples: [1]

    Role:
      type: string
      description: Role of a user (ADR-0004). A user has exactly one.
      enum: [CITIZEN, MUNICIPAL_OPERATOR, TECHNICIAN, ADMINISTRATOR, ANALYST]
      examples: [CITIZEN]

    CreateRegistrationRequest:
      type: object
      description: Data to create a citizen account.
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "\\S"
          description: Full name, shown to staff working on the user's incidents. It may not be blank.
          examples: [Lucía Martín]
        email:
          type: string
          format: email
          maxLength: 254
          description: >-
            Email used to sign in. It is stored in lower case and is unique, so two emails that
            only differ in case are the same account.
          examples: [lucia.martin@example.com]
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: >-
            At least 8 characters and at most 72 bytes in UTF-8 (a password hash limit; a letter
            such as "ñ" takes 2 bytes). The server checks the byte length and returns `422` above
            it. It is stored hashed and never returned.
          examples: [correct-horse-battery]

    CreateSessionRequest:
      type: object
      description: Credentials to sign in.
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          examples: [lucia.martin@example.com]
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          examples: [correct-horse-battery]

    RefreshSessionRequest:
      type: object
      description: The refresh token received with the last token pair.
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          examples: [Yh2k7sQ9vX1mN4pR8tW3zB6cF0gJ5lD2]

    SessionResponse:
      type: object
      description: >-
        Token pair of a session (ADR-0004). Each client keeps the refresh token in the storage
        agreed for it (#39) and sends the access token in `Authorization: Bearer`.
      required: [tokenType, accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        tokenType:
          type: string
          const: Bearer
          examples: [Bearer]
        accessToken:
          type: string
          description: Signed JWT with the user id and role. Clients do not need to decode it.
          examples: [eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI3YzJlIn0.c2lnbmF0dXJl]
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: When the access token expires (UTC).
          examples: ["2026-11-02T10:15:00Z"]
        refreshToken:
          type: string
          description: Opaque token for `refreshSession`. It works once.
          examples: [Yh2k7sQ9vX1mN4pR8tW3zB6cF0gJ5lD2]
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: When the refresh token expires (UTC). After it, the user signs in again.
          examples: ["2026-11-16T10:00:00Z"]

    UserResponse:
      type: object
      description: Public profile of a user. It never includes the password or its hash.
      required: [id, name, email, role]
      properties:
        id:
          type: string
          format: uuid
          examples: [7c2e4b1a-9d3f-4e8a-b6c5-1f0a2d3e4b5c]
        name:
          type: string
          examples: [Lucía Martín]
        email:
          type: string
          format: email
          examples: [lucia.martin@example.com]
        role:
          $ref: "#/components/schemas/Role"
        enabled:
          type: boolean
          description: >-
            Whether the account can sign in. Planned: #191. It is optional only until then, because
            the backend does not send it yet; that pull request makes it required.

    UserPageResponse:
      type: object
      description: One page of users.
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        page:
          $ref: "#/components/schemas/PageMetadata"

    CreateUserRequest:
      type: object
      description: Data to create a staff account.
      required: [name, email, password, role]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "\\S"
          description: Full name. It may not be blank.
          examples: [Pedro Gómez]
        email:
          type: string
          format: email
          maxLength: 254
          description: Email used to sign in, stored in lower case and unique.
          examples: [pedro.gomez@example.com]
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: >-
            Initial password, under the same rules as in `createRegistration`. It stops working
            when the user changes it at the first sign-in.
          examples: [correct-horse-battery]
        role:
          description: A staff role. `CITIZEN` returns `422`.
          $ref: "#/components/schemas/Role"

    UpdateUserRequest:
      type: object
      description: The properties to change; the absent ones stay as they are.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "\\S"
          description: Full name. It may not be blank.
          examples: [Pedro Gómez]
        role:
          $ref: "#/components/schemas/Role"
        enabled:
          type: boolean
          description: "`false` disables the account and `true` enables it again."
          examples: [false]

    TechnicianSummary:
      type: object
      description: An enabled technician, as the assignment form shows it.
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          examples: [7c2e4b1a-9d3f-4e8a-b6c5-1f0a2d3e4b5c]
        name:
          type: string
          examples: [Pedro Gómez]

    CreatePasswordChangeRequest:
      type: object
      description: The credentials of the account and its new password.
      required: [email, currentPassword, newPassword]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          examples: [pedro.gomez@example.com]
        currentPassword:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          examples: [correct-horse-battery]
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: >-
            Under the same rules as in `createRegistration`. It must differ from the current one, or
            the request returns `422`.
          examples: [another-long-passphrase]

    AuditAction:
      type: string
      description: >-
        What an audit entry records (docs/security.md, "Audit trail"). A value is never renamed or
        removed, because old entries keep it; new ones are added with the feature that records
        them.
      enum:
        [
          CREATE_USER,
          UPDATE_USER,
          CHANGE_ROLE,
          DISABLE_USER,
          ENABLE_USER,
          CHANGE_PASSWORD,
          CLASSIFY_INCIDENT,
        ]
      examples: [CHANGE_ROLE]

    AuditTargetType:
      type: string
      description: The kind of record an audit entry is about.
      enum: [USER, INCIDENT]
      examples: [USER]

    AuditActor:
      type: object
      description: >-
        Who made the change. It has no role on purpose: the trail does not store the role the actor
        had at that moment, and their current role could be a different one.
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          examples: [7c2e4b1a-9d3f-4e8a-b6c5-1f0a2d3e4b5c]
        name:
          type: string
          examples: [Lucía Martín]

    AuditTarget:
      type: object
      description: The record the entry is about.
      required: [type, id, label]
      properties:
        type:
          $ref: "#/components/schemas/AuditTargetType"
        id:
          type: string
          format: uuid
          examples: [2b8d4f6a-1c3e-4a5b-9d7f-0e2c4a6b8d1f]
        label:
          type: [string, "null"]
          description: >-
            Current name of the user or title of the incident, to recognise the record without its
            id. `null` when the record no longer exists.
          examples: [Pedro Gómez]

    AuditValue:
      description: A value recorded in an entry; entries only hold scalars.
      type: [string, number, boolean, "null"]

    AuditDetails:
      type: object
      description: >-
        The values the change replaced (`before`) and the ones it set (`after`), by field. A side
        that does not exist, such as the `before` of a creation, is an empty object; a field that
        had no value is `null`, not left out. Never holds passwords, tokens, names or emails.
      required: [before, after]
      properties:
        before:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AuditValue"
          examples: [{ role: TECHNICIAN }]
        after:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AuditValue"
          examples: [{ role: MUNICIPAL_OPERATOR }]

    AuditEntryResponse:
      type: object
      description: One entry of the audit trail (RF18).
      required: [id, instant, actor, action, target, details]
      properties:
        id:
          type: string
          format: uuid
          examples: [9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d]
        instant:
          type: string
          format: date-time
          description: When the change happened (UTC).
          examples: ["2026-11-02T09:58:31Z"]
        actor:
          $ref: "#/components/schemas/AuditActor"
        action:
          $ref: "#/components/schemas/AuditAction"
        target:
          description: "`null` when the action is not about a single record."
          oneOf:
            - $ref: "#/components/schemas/AuditTarget"
            - type: "null"
        details:
          description: "`null` when the entry has no details."
          oneOf:
            - $ref: "#/components/schemas/AuditDetails"
            - type: "null"

    AuditEntryPageResponse:
      type: object
      description: One page of audit entries.
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntryResponse"
        page:
          $ref: "#/components/schemas/PageMetadata"

    IncidentStatus:
      type: string
      description: >-
        Lifecycle status (ADR-0020). `IN_PROGRESS` is the "IN PROGRESS" status of the case study.
      enum: [REPORTED, VALIDATED, REJECTED, ASSIGNED, IN_PROGRESS, RESOLVED, REOPENED, CLOSED]
      examples: [REPORTED]

    Priority:
      type: string
      description: Priority set by an operator.
      enum: [LOW, MEDIUM, HIGH]
      examples: [HIGH]

    CategoryResponse:
      type: object
      description: Category an incident can be classified in.
      required: [id, name, description]
      properties:
        id:
          type: string
          format: uuid
          examples: [a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d]
        name:
          type: string
          examples: [Street lighting]
        description:
          type: [string, "null"]
          description: Help text for the citizen. `null` when the category has none.
          examples: [Broken or flickering street lights.]

    CategorySummary:
      type: object
      description: Category of an incident, embedded so a listing needs no extra request.
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          examples: [a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d]
        name:
          type: string
          examples: [Street lighting]

    CreateIncidentRequest:
      type: object
      description: >-
        A citizen's report. The category is optional: an operator classifies the incident if the
        citizen does not.
      required: [title, description, location]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          pattern: "\\S"
          description: Short summary. It may not be blank.
          examples: [Street light off]
        description:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
          description: What happens and where. It may not be blank.
          examples: [The street light in front of number 12 has been off for three days.]
        categoryId:
          type: string
          format: uuid
          description: >-
            An active category from `listCategories`. Absent if the citizen does not choose one; an
            unknown or inactive category returns `422`.
          examples: [a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d]
        location:
          $ref: "#/components/schemas/ReportedLocation"

    ReportedLocation:
      type: object
      description: Position of the incident as the device measured it.
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: WGS 84 latitude in decimal degrees.
          examples: [36.7213]
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: WGS 84 longitude in decimal degrees.
          examples: [-4.4214]
        accuracy:
          type: number
          format: double
          minimum: 0
          description: >-
            Accuracy radius in metres reported by the device. Absent when the device does not
            report it.
          examples: [12.5]

    IncidentLocation:
      type: object
      description: >-
        Position of the incident and what is known about the place. `null` in `accuracy`,
        `address`, `neighborhood` or `district` means "not available": unknown or not looked up
        yet, never "none".
      required: [latitude, longitude, accuracy, address, neighborhood, district]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: WGS 84 latitude in decimal degrees.
          examples: [36.7213]
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: WGS 84 longitude in decimal degrees.
          examples: [-4.4214]
        accuracy:
          type: [number, "null"]
          format: double
          minimum: 0
          description: Accuracy radius in metres. `null` when the device did not report it.
          examples: [12.5]
        address:
          type: [string, "null"]
          description: Normalized address. `null` while not available.
          examples: [null]
        neighborhood:
          type: [string, "null"]
          description: Neighbourhood of Málaga. `null` while not available.
          examples: [null]
        district:
          type: [string, "null"]
          description: District of Málaga. `null` while not available.
          examples: [null]

    IncidentSummaryResponse:
      type: object
      description: >-
        One incident in a listing. `priority` is staff-only: it is absent in the responses to a
        citizen.
      required: [id, title, status, category, reportedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          examples: [3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e]
        title:
          type: string
          examples: [Street light off]
        status:
          $ref: "#/components/schemas/IncidentStatus"
        priority:
          description: Staff only. `null` while the incident has no priority.
          oneOf:
            - $ref: "#/components/schemas/Priority"
            - type: "null"
        category:
          description: "`null` while the incident has no category."
          oneOf:
            - $ref: "#/components/schemas/CategorySummary"
            - type: "null"
        reportedAt:
          type: string
          format: date-time
          examples: ["2026-11-02T09:58:31Z"]
        updatedAt:
          type: string
          format: date-time
          description: Last change of the incident, including status changes.
          examples: ["2026-11-02T09:58:31Z"]

    IncidentPageResponse:
      type: object
      description: One page of incidents.
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/IncidentSummaryResponse"
        page:
          $ref: "#/components/schemas/PageMetadata"

    IncidentResponse:
      type: object
      description: >-
        Full incident. `priority`, `priorityReason`, `assignment` and `version` are staff-only: they
        are absent in the responses to a citizen.
      required:
        [id, title, description, status, category, location, reportedAt, updatedAt, closedAt]
      properties:
        id:
          type: string
          format: uuid
          examples: [3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e]
        title:
          type: string
          examples: [Street light off]
        description:
          type: string
          examples: [The street light in front of number 12 has been off for three days.]
        status:
          $ref: "#/components/schemas/IncidentStatus"
        priority:
          description: Staff only. `null` while the incident has no priority.
          oneOf:
            - $ref: "#/components/schemas/Priority"
            - type: "null"
        priorityReason:
          type: [string, "null"]
          description: >-
            Staff only. Justification of the current priority. `null` while the incident has no
            priority.
        assignment:
          description: >-
            Staff only. The active assignment. `null` while the incident has none. Previous
            assignments are not listed here.
          oneOf:
            - $ref: "#/components/schemas/AssignmentResponse"
            - type: "null"
        category:
          description: "`null` while the incident has no category."
          oneOf:
            - $ref: "#/components/schemas/CategorySummary"
            - type: "null"
        location:
          $ref: "#/components/schemas/IncidentLocation"
        reportedAt:
          type: string
          format: date-time
          examples: ["2026-11-02T09:58:31Z"]
        updatedAt:
          type: string
          format: date-time
          examples: ["2026-11-02T09:58:31Z"]
        closedAt:
          type: [string, "null"]
          format: date-time
          description: When the incident was closed. `null` while it is not closed.
          examples: [null]
        version:
          type: integer
          minimum: 0
          description: >-
            Staff only. Changes every time the incident changes. Lifecycle actions send back the
            version the client read; if the incident changed since then, they answer `409` with
            the code `CONCURRENT_MODIFICATION` (ADR-0020).
          examples: [3]

    StatusChangeActor:
      type: object
      description: Who made a status change.
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
          examples: [7c2e4b1a-9d3f-4e8a-b6c5-1f0a2d3e4b5c]
        name:
          type: string
          examples: [Lucía Martín]
        role:
          $ref: "#/components/schemas/Role"

    StatusChangeResponse:
      type: object
      description: >-
        One entry of the status history (ADR-0020). `actor` and `visibleToCitizen` are staff-only:
        they are absent in the responses to a citizen.
      required: [id, instant, previousStatus, newStatus, reason]
      properties:
        id:
          type: string
          format: uuid
          examples: [5e6f7a8b-9c0d-4e1f-a2b3-c4d5e6f7a8b9]
        instant:
          type: string
          format: date-time
          description: When the change happened (UTC).
          examples: ["2026-11-02T09:58:31Z"]
        previousStatus:
          description: "`null` in the first entry, when the incident was reported."
          oneOf:
            - $ref: "#/components/schemas/IncidentStatus"
            - type: "null"
        newStatus:
          $ref: "#/components/schemas/IncidentStatus"
        reason:
          type: [string, "null"]
          description: >-
            Reason or message of the change, such as the reason of a rejection or the message of
            an information request. `null` when there is none, or when the caller is a citizen and
            ADR-0020 does not show it to citizens.
          examples: [null]
        actor:
          $ref: "#/components/schemas/StatusChangeActor"
        visibleToCitizen:
          type: boolean
          description: Staff only. Whether the citizen sees this entry.
          examples: [true]

    UpdateIncidentRequest:
      type: object
      description: >-
        The classification to change, with at least one of `categoryId` and `priority`. The absent
        ones stay as they are.
      required: [version]
      properties:
        version:
          $ref: "#/components/schemas/IncidentVersion"
        categoryId:
          type: string
          format: uuid
          description: An active category. An unknown or inactive one returns `422`.
          examples: [a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d]
        priority:
          $ref: "#/components/schemas/Priority"
        priorityReason:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
          description: Why this priority. Required with `priority`, and not accepted without it.
          examples: [The street is dark near a school.]

    ClassificationValues:
      type: object
      description: >-
        Classification values of an incident at one moment. A property is present only if that value
        changed; `null` means it had no value.
      properties:
        category:
          oneOf:
            - $ref: "#/components/schemas/CategorySummary"
            - type: "null"
        priority:
          oneOf:
            - $ref: "#/components/schemas/Priority"
            - type: "null"
        priorityReason:
          type: [string, "null"]
          description: Justification of the priority.
          examples: [The street is dark near a school.]

    ClassificationChangeResponse:
      type: object
      description: One change of the category or the priority of an incident. Only staff get it.
      required: [id, instant, actor, before, after]
      properties:
        id:
          type: string
          format: uuid
          description: Identifier of the audit entry.
          examples: [9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d]
        instant:
          type: string
          format: date-time
          description: When the change happened (UTC).
          examples: ["2026-11-02T10:30:00Z"]
        actor:
          $ref: "#/components/schemas/AuditActor"
        before:
          $ref: "#/components/schemas/ClassificationValues"
        after:
          $ref: "#/components/schemas/ClassificationValues"

    ClassificationChangePageResponse:
      type: object
      description: One page of classification changes.
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ClassificationChangeResponse"
        page:
          $ref: "#/components/schemas/PageMetadata"

    IncidentVersion:
      type: integer
      minimum: 0
      description: >-
        The `version` of the incident the client read. If the incident changed since then, the
        request returns `409` with the code `CONCURRENT_MODIFICATION` and changes nothing.
      examples: [3]

    IncidentActionRequest:
      type: object
      description: A lifecycle action that needs no data besides the version.
      required: [version]
      properties:
        version:
          $ref: "#/components/schemas/IncidentVersion"
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
          description: Optional note that only staff see (ADR-0020).
          examples: [Checked on site.]

    IncidentReasonRequest:
      type: object
      description: >-
        A lifecycle action that needs a text. Its operation says what `reason` means and who sees
        it.
      required: [version, reason]
      properties:
        version:
          $ref: "#/components/schemas/IncidentVersion"
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
          description: The reason, the message to the citizen or the resolution notes. Blank returns `422`.
          examples: [Duplicate of the report at number 12.]

    DepartmentResponse:
      type: object
      description: Department that incidents can be assigned to.
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          examples: [d1e2f3a4-b5c6-4d7e-8f9a-0b1c2d3e4f5a]
        name:
          type: string
          examples: [Street lighting service]

    CreateAssignmentRequest:
      type: object
      description: Who becomes responsible for the incident.
      required: [version, departmentId]
      properties:
        version:
          $ref: "#/components/schemas/IncidentVersion"
        departmentId:
          type: string
          format: uuid
          description: An active department from `listDepartments`.
          examples: [d1e2f3a4-b5c6-4d7e-8f9a-0b1c2d3e4f5a]
        technicianId:
          type: string
          format: uuid
          description: An active technician from `listTechnicians`. Absent to assign the department only.
          examples: [7c2e4b1a-9d3f-4e8a-b6c5-1f0a2d3e4b5c]
        team:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "\\S"
          description: Team inside the department. Absent if there is none.
          examples: [Night shift]

    AssignmentResponse:
      type: object
      description: An assignment of an incident. Only staff get it.
      required: [id, department, technician, team, assignedAt]
      properties:
        id:
          type: string
          format: uuid
          examples: [e5f6a7b8-c9d0-4e1f-a2b3-c4d5e6f7a8b9]
        department:
          $ref: "#/components/schemas/DepartmentResponse"
        technician:
          description: "`null` when it is assigned to the department only."
          oneOf:
            - $ref: "#/components/schemas/TechnicianSummary"
            - type: "null"
        team:
          type: [string, "null"]
          description: "`null` when there is no team."
          examples: [Night shift]
        assignedAt:
          type: string
          format: date-time
          examples: ["2026-11-02T11:20:00Z"]

    CreateCommentRequest:
      type: object
      description: An internal comment.
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
          description: The comment. Blank or too long returns `422`.
          examples: [The access is through the back street.]

    CommentResponse:
      type: object
      description: An internal comment on an incident.
      required: [id, author, text, createdAt]
      properties:
        id:
          type: string
          format: uuid
          examples: [f6a7b8c9-d0e1-4f2a-b3c4-d5e6f7a8b9c0]
        author:
          $ref: "#/components/schemas/StatusChangeActor"
        text:
          type: string
          examples: [The access is through the back street.]
        createdAt:
          type: string
          format: date-time
          examples: ["2026-11-02T12:05:00Z"]

    CommentPageResponse:
      type: object
      description: One page of comments.
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/CommentResponse"
        page:
          $ref: "#/components/schemas/PageMetadata"

    CreateAttachmentRequest:
      type: object
      description: The photo to upload.
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: A JPEG, PNG or WebP image.

    AttachmentResponse:
      type: object
      description: >-
        Metadata of a stored photo. It never holds the storage key or a public URL (ADR-0013).
      required: [id, fileName, contentType, size, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
          examples: [c4d5e6f7-a8b9-4c0d-9e1f-2a3b4c5d6e7f]
        fileName:
          type: string
          description: Name of the file on the device, only to show it. It is never used as a path.
          examples: [street-light.jpg]
        contentType:
          type: string
          description: The type detected from the content.
          enum: [image/jpeg, image/png, image/webp]
          examples: [image/jpeg]
        size:
          type: integer
          format: int64
          minimum: 1
          description: Size of the file in bytes.
          examples: [2483115]
        uploadedAt:
          type: string
          format: date-time
          examples: ["2026-11-02T10:00:12Z"]

    IncidentPosition:
      type: object
      description: An incident on the map. The side panel reads the rest with `getIncident`.
      required: [id, status, priority, latitude, longitude]
      properties:
        id:
          type: string
          format: uuid
          examples: [3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e]
        status:
          $ref: "#/components/schemas/IncidentStatus"
        priority:
          description: "`null` while the incident has no priority."
          oneOf:
            - $ref: "#/components/schemas/Priority"
            - type: "null"
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: WGS 84 latitude in decimal degrees.
          examples: [36.7213]
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: WGS 84 longitude in decimal degrees.
          examples: [-4.4214]

    IncidentLocationListResponse:
      type: object
      description: The positions for the map, at most 1,000.
      required: [content, truncated]
      properties:
        content:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/IncidentPosition"
        truncated:
          type: boolean
          description: "`true` when more incidents match than the cap allows, so some are left out."
          examples: [false]

    IncidentReportGrouping:
      type: string
      description: How a report groups the incidents. `department` uses the active assignment.
      enum: [status, category, priority, department, district]
      examples: [category]

    IncidentReportRow:
      type: object
      description: >-
        One group of a report, only for groups with incidents. `total` is the sum of `open`, `closed`
        and `rejected`; `open` counts every status that is not final, including `RESOLVED`.
      required: [group, total, open, closed, rejected, resolutionHoursP50, resolutionHoursP95]
      properties:
        group:
          type: [string, "null"]
          description: >-
            The status, priority, or name of the category, department or district. `null` means "not
            available", for example an incident without a district; it goes last.
          examples: [Street lighting]
        total:
          type: integer
          format: int64
          minimum: 0
          examples: [12]
        open:
          type: integer
          format: int64
          minimum: 0
          examples: [5]
        closed:
          type: integer
          format: int64
          minimum: 0
          examples: [6]
        rejected:
          type: integer
          format: int64
          minimum: 0
          examples: [1]
        resolutionHoursP50:
          type: [number, "null"]
          format: double
          minimum: 0
          description: >-
            Median hours from reported to closed, of the closed incidents, rounded to two decimals
            (continuous percentile, as `PERCENTILE.INC` of a spreadsheet). `null` when none is
            closed, never `0`.
          examples: [18.5]
        resolutionHoursP95:
          type: [number, "null"]
          format: double
          minimum: 0
          description: >-
            95th percentile of the same hours, computed and rounded the same way. `null` when none
            is closed, never `0`.
          examples: [40.25]

    IncidentReportResponse:
      type: object
      description: >-
        An operational report. Status and priority go in their declared order and the others
        alphabetically. It is not paginated: the groups are few by nature.
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/IncidentReportRow"

  responses:
    ContentTooLarge:
      description: "The file is over the size limit. Code: `FILE_TOO_LARGE`."
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Content Too Large
            status: 413
            code: FILE_TOO_LARGE
            detail: The file is over the size limit.
            instance: /api/v1/incidents/3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e/attachments
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    BadRequest:
      description: >-
        The request is malformed: the body is not valid JSON, a value has the wrong type, or a
        parameter is out of range (for example `size` over 100). Validation of well-formed data
        returns `422` instead.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: MALFORMED_REQUEST
            detail: The request body is not valid JSON.
            instance: /api/v1/incidents
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    Unauthorized:
      description: The access token is missing, invalid or expired.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: The access token has expired.
            instance: /api/v1/incidents
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    Forbidden:
      description: >-
        The user is authenticated but their role or relationship with the resource does not allow
        this action.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: You are not allowed to perform this action.
            instance: /api/v1/incidents
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    NotFound:
      description: The resource does not exist or the user is not allowed to know that it exists.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Incident 3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e does not exist.
            instance: /api/v1/incidents/3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    Conflict:
      description: >-
        The request conflicts with the current state of the resource, for example a status
        transition that is not allowed, a change made on a stale version or a duplicated unique
        value. `code` says which.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: INVALID_TRANSITION
            detail: An incident in status CLOSED cannot change to IN_PROGRESS.
            instance: /api/v1/incidents/3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e/acceptance
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    UnprocessableEntity:
      description: >-
        The request is well formed but its data does not pass validation. `errors` lists every
        invalid field, so a form can show them all at once.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: VALIDATION_FAILED
            detail: The request has 2 invalid fields.
            instance: /api/v1/incidents
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            errors:
              - field: title
                message: must not be blank
              - field: location.latitude
                message: must be between -90 and 90

    TooManyRequests:
      description: Too many attempts in a short time. `Retry-After` says when to try again.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            code: TOO_MANY_ATTEMPTS
            detail: Too many attempts. Try again later.
            instance: /api/v1/sessions
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    InternalServerError:
      description: Unexpected error. The body never reveals internal details; use `traceId`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
