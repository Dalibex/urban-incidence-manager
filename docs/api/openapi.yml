# UrbanPulse REST API contract (ADR-0008, contract first).
#
# This file is the source of truth for the API: the backend implements it and the clients generate
# their types from it. The contract of a feature is merged before or together with its
# implementation, never after it: the Sprint 1 operations were agreed ahead in #93, and each later
# feature opens its own contract change first. How to do it: docs/api.md.
openapi: 3.1.0

info:
  title: UrbanPulse API
  version: 0.0.1
  summary: Cloud platform for the intelligent management of urban incidents.
  description: |
    REST API shared by the UrbanPulse web and mobile clients.

    - **Authentication:** every operation requires a JWT access token in the
      `Authorization: Bearer <token>` header (ADR-0004). Public operations opt out explicitly
      with `security: []`.
    - **Errors:** every error is returned as `application/problem+json`
      ([RFC 9457](https://www.rfc-editor.org/rfc/rfc9457)) with the `Problem` schema. Clients
      branch on `status` and `code`, never on the text of `detail`.
    - **Formats:** JSON with `camelCase` properties, instants in UTC (ISO 8601) and coordinates in
      WGS 84 (EPSG:4326), always as separate `latitude` and `longitude` properties.
    - **Listings:** paginated with `page`, `size` and `sort`; the response carries `content` and
      a `page` object.

    Conventions and the steps to add an endpoint are in `docs/api.md`.
  license:
    name: Apache 2.0
    identifier: Apache-2.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local backend (./mvnw spring-boot:run or the development compose)
  - url: /api/v1
    description: Same origin as the page showing the docs (Swagger UI served by the backend or a reverse proxy)
  # Staging is added here when the environment exists.

# Applied to every operation. A public operation (login, sign-up, refresh) overrides it with
# `security: []`.
security:
  - bearerAuth: []

# One tag per backend module (ADR-0010). Every operation has exactly one of these tags, the one of
# the module that implements it. `shared` is not a module and has no tag.
tags:
  - name: identity
    description: Users, roles and permissions; sign-up, login and token refresh; audit log.
  - name: incidents
    description: >-
      Incident reporting, categories, priority, lifecycle and status history, assignments,
      comments and evidence.
  - name: geospatial
    description: Districts, neighbourhoods, urban assets and spatial queries.
  - name: urbancontext
    description: >-
      External urban context (Open Data Málaga, OpenStreetMap, weather and traffic) and the
      enrichment of incidents.
  - name: notifications
    description: Notifications created on incident changes and their delivery status.
  - name: analytics
    description: Read-only indicators, zone analysis and reports.

paths:
  # --- identity (#35) ---------------------------------------------------------------------------

  /registrations:
    post:
      tags: [identity]
      operationId: createRegistration
      summary: Sign up as a citizen
      description: |
        Creates a citizen account. The new user always gets the `CITIZEN` role: a `role` sent in
        the body is ignored. Staff accounts are created by an administrator, not here. The
        response does not sign the user in; the client calls `createSession` afterwards.

        `EMAIL_ALREADY_EXISTS` reveals that an email has an account, so sign-up is rate limited
        like sign-in, to keep anyone from checking many emails.

        Roles: public.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRegistrationRequest"
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: "An account with this email already exists. Code: `EMAIL_ALREADY_EXISTS`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: about:blank
                title: Conflict
                status: 409
                code: EMAIL_ALREADY_EXISTS
                detail: An account with this email already exists.
                instance: /api/v1/registrations
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /sessions:
    post:
      tags: [identity]
      operationId: createSession
      summary: Sign in
      description: |
        Checks the email and password and returns a new token pair (ADR-0004). Repeated failed
        attempts are rate limited.

        A wrong email and a wrong password get the same `401`, so sign-in does not reveal which
        emails have an account (sign-up does, with `EMAIL_ALREADY_EXISTS`). `ACCOUNT_DISABLED` is
        only returned when the password is right.

        Roles: public.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Signed in. The body holds the new token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: "The email or the password is wrong. Code: `INVALID_CREDENTIALS`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: INVALID_CREDENTIALS
                detail: The email or the password is not correct.
                instance: /api/v1/sessions
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        "403":
          description: "The credentials are right but the account is disabled. Code: `ACCOUNT_DISABLED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: about:blank
                title: Forbidden
                status: 403
                code: ACCOUNT_DISABLED
                detail: This account is disabled.
                instance: /api/v1/sessions
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /sessions/refresh:
    post:
      tags: [identity]
      operationId: refreshSession
      summary: Renew the token pair
      description: |
        Exchanges a refresh token for a new token pair. The refresh token is rotated: the one sent
        stops working, and sending it again fails.

        A client must not try to refresh again when this operation returns `401`: it signs the
        user out instead.

        Roles: public (the refresh token is the credential).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: The new token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: >-
            The refresh token is unknown, expired, revoked or already used, or the account is
            disabled. Code: `INVALID_REFRESH_TOKEN`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: INVALID_REFRESH_TOKEN
                detail: The session has expired. Sign in again.
                instance: /api/v1/sessions/refresh
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /sessions/current:
    delete:
      tags: [identity]
      operationId: deleteCurrentSession
      summary: Sign out
      description: |
        Revokes the refresh token of the session the access token belongs to: the access token
        carries the id of the refresh token issued with it. Other sessions of the same user (other
        devices) stay open. The access token keeps working until it expires (about 15 minutes,
        ADR-0004), so the client discards both tokens.

        It is idempotent: a session that is already revoked also returns `204`. If the access
        token has expired, the client refreshes first and then signs out, so the refresh token
        does not stay valid on the device.

        Roles: any authenticated user.
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/me:
    get:
      tags: [identity]
      operationId: getCurrentUser
      summary: Get the signed-in user
      description: |
        Profile and role of the user the access token belongs to. The clients use `role` to choose
        the landing screen; the API checks the role again in every operation.

        Roles: any authenticated user.
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # --- incidents (#37, #43) ---------------------------------------------------------------------

  /categories:
    get:
      tags: [incidents]
      operationId: listCategories
      summary: List the active categories
      description: |
        Active categories, ordered by name, for the category drop-down of the report form. It is a
        short reference list managed by administrators, so it is not paginated.

        Roles: any authenticated user.
      responses:
        "200":
          description: The active categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /incidents:
    get:
      tags: [incidents]
      operationId: listIncidents
      summary: List the incidents the user can see
      description: |
        Paginated incidents, scoped by role (#37):

        - `CITIZEN`: only the incidents they reported.
        - `TECHNICIAN`: only the incidents actively assigned to them.
        - `MUNICIPAL_OPERATOR`, `ADMINISTRATOR`: all incidents.
        - `ANALYST`: no access yet (`403`); analytics comes in a later milestone.

        Sortable properties: `reportedAt`, `updatedAt`. Default `reportedAt,desc` (newest first);
        `id` is always added as the last criterion so the order is stable between pages.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
        - name: status
          in: query
          description: >-
            Only incidents in one of these statuses. Repeat it for several values
            (`?status=REPORTED&status=VALIDATED`). Absent means every status.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/IncidentStatus"
          style: form
          explode: true
      responses:
        "200":
          description: One page of incidents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [incidents]
      operationId: createIncident
      summary: Report an incident
      description: |
        Creates an incident in `REPORTED` status with its first history entry, in one transaction
        (#37, ADR-0020). The reporter is the user of the access token, never a property of the
        body.

        No external source is called while reporting (RF26): `address`, `neighborhood` and
        `district` start as `null` ("not available yet") and are filled in later, when enrichment
        exists.

        Roles: `CITIZEN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIncidentRequest"
      responses:
        "201":
          description: The incident was created. `Location` points to it and the body repeats it.
          headers:
            Location:
              description: URL of the new incident.
              schema:
                type: string
                format: uri-reference
                examples: [/api/v1/incidents/3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /incidents/{incidentId}:
    get:
      tags: [incidents]
      operationId: getIncident
      summary: Get an incident
      description: |
        The incident, if the user may see it under the rules of `listIncidents`. An incident the
        user may not see returns `404`, the same as one that does not exist, so its existence is
        not revealed (#37).

        Roles: `CITIZEN` (own incidents), `TECHNICIAN` (actively assigned), `MUNICIPAL_OPERATOR`,
        `ADMINISTRATOR`. `ANALYST` gets `403`.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: The incident.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /incidents/{incidentId}/status-changes:
    get:
      tags: [incidents]
      operationId: listIncidentStatusChanges
      summary: Get the status history of an incident
      description: |
        Every status change of the incident, oldest first. It is not paginated: the lifecycle of
        ADR-0020 bounds it to a few entries per incident.

        A citizen only gets the entries visible to them, with the reason only where ADR-0020 says
        the citizen sees it, and without the staff-only properties. Staff get every entry.

        Roles: the same as `getIncident`, with the same `404` rule.
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: The status history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusChangeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Short-lived JWT access token (about 15 minutes) issued by the API and renewed with a
        rotating refresh token (ADR-0004).

  parameters:
    IncidentId:
      name: incidentId
      in: path
      required: true
      description: Identifier of the incident.
      schema:
        type: string
        format: uuid
        examples: [3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e]

    Page:
      name: page
      in: query
      description: Page number, starting at 0.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

    Size:
      name: size
      in: query
      description: Items per page. A value over 100 returns `400`; it is never silently reduced.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

    Sort:
      name: sort
      in: query
      description: >-
        Sort criterion as `property,asc` or `property,desc`. Each listing documents the properties
        it accepts and its default; an unknown property returns `400`.
      schema:
        type: string
        pattern: "^[a-zA-Z]+,(asc|desc)$"
        examples: ["reportedAt,desc"]

  headers:
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
        minimum: 1
        examples: [60]

  schemas:
    Problem:
      type: object
      description: >-
        Error body for every 4xx and 5xx response (RFC 9457 Problem Details). Clients must not
        parse `detail`, which is for humans; they branch on `status` and, when present, `code`.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: >-
            Identifies the kind of problem. `about:blank` when the HTTP status says it all.
          default: about:blank
          examples: [about:blank]
        title:
          type: string
          description: Short, human-readable summary of the kind of problem.
          examples: [Not Found]
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          description: HTTP status code, repeated in the body.
          examples: [404]
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
          description: >-
            Stable, machine-readable reason, for the cases where the status alone is not enough
            for the client (for example `INVALID_CREDENTIALS` and `ACCOUNT_DISABLED`). Once
            published, a code never changes its meaning. The catalogue is in `docs/api.md`.
          examples: [EMAIL_ALREADY_EXISTS]
        detail:
          type: string
          description: >-
            Explanation of this occurrence. Never contains stack traces, SQL or personal data.
          examples: [Incident 3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e does not exist.]
        instance:
          type: string
          format: uri-reference
          description: Request path where the problem happened.
          examples: [/api/v1/incidents/3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e]
        traceId:
          type: string
          description: >-
            Correlation identifier of the request, also written to the logs, so a report from a
            user can be matched with the server side.
          examples: [4bf92f3577b34da6a3ce929d0e0e4736]
        errors:
          type: array
          description: Only in `422` responses, one item per invalid field.
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      description: One invalid field of the request.
      required: [field, message]
      properties:
        field:
          type: string
          description: Path of the invalid property in the request body, or name of the parameter.
          examples: [location.latitude]
        message:
          type: string
          description: Why the value is not valid.
          examples: [must be between -90 and 90]

    PageMetadata:
      type: object
      description: Position of a page inside a paginated listing.
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
          format: int32
          minimum: 0
          description: Number of this page, starting at 0.
          examples: [0]
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Requested page size. The last page may hold fewer items.
          examples: [20]
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: Items in the whole listing with the current filters.
          examples: [1]
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: Pages in the whole listing with the current filters.
          examples: [1]

    Role:
      type: string
      description: Role of a user (ADR-0004). A user has exactly one.
      enum: [CITIZEN, MUNICIPAL_OPERATOR, TECHNICIAN, ADMINISTRATOR, ANALYST]
      examples: [CITIZEN]

    CreateRegistrationRequest:
      type: object
      description: Data to create a citizen account.
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "\\S"
          description: Full name, shown to staff working on the user's incidents. It may not be blank.
          examples: [Lucía Martín]
        email:
          type: string
          format: email
          maxLength: 254
          description: >-
            Email used to sign in. It is stored in lower case and is unique, so two emails that
            only differ in case are the same account.
          examples: [lucia.martin@example.com]
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: >-
            At least 8 characters and at most 72 bytes in UTF-8 (a password hash limit; a letter
            such as "ñ" takes 2 bytes). The server checks the byte length and returns `422` above
            it. It is stored hashed and never returned.
          examples: [correct-horse-battery]

    CreateSessionRequest:
      type: object
      description: Credentials to sign in.
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          examples: [lucia.martin@example.com]
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          examples: [correct-horse-battery]

    RefreshSessionRequest:
      type: object
      description: The refresh token received with the last token pair.
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          examples: [Yh2k7sQ9vX1mN4pR8tW3zB6cF0gJ5lD2]

    SessionResponse:
      type: object
      description: >-
        Token pair of a session (ADR-0004). Each client keeps the refresh token in the storage
        agreed for it (#39) and sends the access token in `Authorization: Bearer`.
      required: [tokenType, accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        tokenType:
          type: string
          const: Bearer
          examples: [Bearer]
        accessToken:
          type: string
          description: Signed JWT with the user id and role. Clients do not need to decode it.
          examples: [eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI3YzJlIn0.c2lnbmF0dXJl]
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: When the access token expires (UTC).
          examples: ["2026-11-02T10:15:00Z"]
        refreshToken:
          type: string
          description: Opaque token for `refreshSession`. It works once.
          examples: [Yh2k7sQ9vX1mN4pR8tW3zB6cF0gJ5lD2]
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: When the refresh token expires (UTC). After it, the user signs in again.
          examples: ["2026-11-16T10:00:00Z"]

    UserResponse:
      type: object
      description: Public profile of a user. It never includes the password or its hash.
      required: [id, name, email, role]
      properties:
        id:
          type: string
          format: uuid
          examples: [7c2e4b1a-9d3f-4e8a-b6c5-1f0a2d3e4b5c]
        name:
          type: string
          examples: [Lucía Martín]
        email:
          type: string
          format: email
          examples: [lucia.martin@example.com]
        role:
          $ref: "#/components/schemas/Role"

    IncidentStatus:
      type: string
      description: >-
        Lifecycle status (ADR-0020). `IN_PROGRESS` is the "IN PROGRESS" status of the case study.
      enum: [REPORTED, VALIDATED, REJECTED, ASSIGNED, IN_PROGRESS, RESOLVED, REOPENED, CLOSED]
      examples: [REPORTED]

    Priority:
      type: string
      description: Priority set by an operator.
      enum: [LOW, MEDIUM, HIGH]
      examples: [HIGH]

    CategoryResponse:
      type: object
      description: Category an incident can be classified in.
      required: [id, name, description]
      properties:
        id:
          type: string
          format: uuid
          examples: [a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d]
        name:
          type: string
          examples: [Street lighting]
        description:
          type: [string, "null"]
          description: Help text for the citizen. `null` when the category has none.
          examples: [Broken or flickering street lights.]

    CategorySummary:
      type: object
      description: Category of an incident, embedded so a listing needs no extra request.
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          examples: [a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d]
        name:
          type: string
          examples: [Street lighting]

    CreateIncidentRequest:
      type: object
      description: >-
        A citizen's report. The category is optional: an operator classifies the incident if the
        citizen does not.
      required: [title, description, location]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          pattern: "\\S"
          description: Short summary. It may not be blank.
          examples: [Street light off]
        description:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
          description: What happens and where. It may not be blank.
          examples: [The street light in front of number 12 has been off for three days.]
        categoryId:
          type: string
          format: uuid
          description: >-
            An active category from `listCategories`. Absent if the citizen does not choose one; an
            unknown or inactive category returns `422`.
          examples: [a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d]
        location:
          $ref: "#/components/schemas/ReportedLocation"

    ReportedLocation:
      type: object
      description: Position of the incident as the device measured it.
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: WGS 84 latitude in decimal degrees.
          examples: [36.7213]
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: WGS 84 longitude in decimal degrees.
          examples: [-4.4214]
        accuracy:
          type: number
          format: double
          minimum: 0
          description: >-
            Accuracy radius in metres reported by the device. Absent when the device does not
            report it.
          examples: [12.5]

    IncidentLocation:
      type: object
      description: >-
        Position of the incident and what is known about the place. `null` in `accuracy`,
        `address`, `neighborhood` or `district` means "not available": unknown or not looked up
        yet, never "none".
      required: [latitude, longitude, accuracy, address, neighborhood, district]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: WGS 84 latitude in decimal degrees.
          examples: [36.7213]
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: WGS 84 longitude in decimal degrees.
          examples: [-4.4214]
        accuracy:
          type: [number, "null"]
          format: double
          minimum: 0
          description: Accuracy radius in metres. `null` when the device did not report it.
          examples: [12.5]
        address:
          type: [string, "null"]
          description: Normalized address. `null` while not available.
          examples: [null]
        neighborhood:
          type: [string, "null"]
          description: Neighbourhood of Málaga. `null` while not available.
          examples: [null]
        district:
          type: [string, "null"]
          description: District of Málaga. `null` while not available.
          examples: [null]

    IncidentSummaryResponse:
      type: object
      description: >-
        One incident in a listing. `priority` is staff-only: it is absent in the responses to a
        citizen.
      required: [id, title, status, category, reportedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          examples: [3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e]
        title:
          type: string
          examples: [Street light off]
        status:
          $ref: "#/components/schemas/IncidentStatus"
        priority:
          description: Staff only. `null` while the incident has no priority.
          oneOf:
            - $ref: "#/components/schemas/Priority"
            - type: "null"
        category:
          description: "`null` while the incident has no category."
          oneOf:
            - $ref: "#/components/schemas/CategorySummary"
            - type: "null"
        reportedAt:
          type: string
          format: date-time
          examples: ["2026-11-02T09:58:31Z"]
        updatedAt:
          type: string
          format: date-time
          description: Last change of the incident, including status changes.
          examples: ["2026-11-02T09:58:31Z"]

    IncidentPageResponse:
      type: object
      description: One page of incidents.
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/IncidentSummaryResponse"
        page:
          $ref: "#/components/schemas/PageMetadata"

    IncidentResponse:
      type: object
      description: >-
        Full incident. `priority` is staff-only: it is absent in the responses to a citizen.
      required:
        [id, title, description, status, category, location, reportedAt, updatedAt, closedAt]
      properties:
        id:
          type: string
          format: uuid
          examples: [3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e]
        title:
          type: string
          examples: [Street light off]
        description:
          type: string
          examples: [The street light in front of number 12 has been off for three days.]
        status:
          $ref: "#/components/schemas/IncidentStatus"
        priority:
          description: Staff only. `null` while the incident has no priority.
          oneOf:
            - $ref: "#/components/schemas/Priority"
            - type: "null"
        category:
          description: "`null` while the incident has no category."
          oneOf:
            - $ref: "#/components/schemas/CategorySummary"
            - type: "null"
        location:
          $ref: "#/components/schemas/IncidentLocation"
        reportedAt:
          type: string
          format: date-time
          examples: ["2026-11-02T09:58:31Z"]
        updatedAt:
          type: string
          format: date-time
          examples: ["2026-11-02T09:58:31Z"]
        closedAt:
          type: [string, "null"]
          format: date-time
          description: When the incident was closed. `null` while it is not closed.
          examples: [null]

    StatusChangeActor:
      type: object
      description: Who made a status change.
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
          examples: [7c2e4b1a-9d3f-4e8a-b6c5-1f0a2d3e4b5c]
        name:
          type: string
          examples: [Lucía Martín]
        role:
          $ref: "#/components/schemas/Role"

    StatusChangeResponse:
      type: object
      description: >-
        One entry of the status history (ADR-0020). `actor` and `visibleToCitizen` are staff-only:
        they are absent in the responses to a citizen.
      required: [id, instant, previousStatus, newStatus, reason]
      properties:
        id:
          type: string
          format: uuid
          examples: [5e6f7a8b-9c0d-4e1f-a2b3-c4d5e6f7a8b9]
        instant:
          type: string
          format: date-time
          description: When the change happened (UTC).
          examples: ["2026-11-02T09:58:31Z"]
        previousStatus:
          description: "`null` in the first entry, when the incident was reported."
          oneOf:
            - $ref: "#/components/schemas/IncidentStatus"
            - type: "null"
        newStatus:
          $ref: "#/components/schemas/IncidentStatus"
        reason:
          type: [string, "null"]
          description: >-
            Reason or message of the change, such as the reason of a rejection or the message of
            an information request. `null` when there is none, or when the caller is a citizen and
            ADR-0020 does not show it to citizens.
          examples: [null]
        actor:
          $ref: "#/components/schemas/StatusChangeActor"
        visibleToCitizen:
          type: boolean
          description: Staff only. Whether the citizen sees this entry.
          examples: [true]

  responses:
    BadRequest:
      description: >-
        The request is malformed: the body is not valid JSON, a value has the wrong type, or a
        parameter is out of range (for example `size` over 100). Validation of well-formed data
        returns `422` instead.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: MALFORMED_REQUEST
            detail: The request body is not valid JSON.
            instance: /api/v1/incidents
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    Unauthorized:
      description: The access token is missing, invalid or expired.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: The access token has expired.
            instance: /api/v1/incidents
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    Forbidden:
      description: >-
        The user is authenticated but their role or relationship with the resource does not allow
        this action.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: You are not allowed to perform this action.
            instance: /api/v1/incidents
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    NotFound:
      description: The resource does not exist or the user is not allowed to know that it exists.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: Incident 3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e does not exist.
            instance: /api/v1/incidents/3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    Conflict:
      description: >-
        The request conflicts with the current state of the resource, for example a status
        transition that is not allowed or a duplicated unique value. `code` says which.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: INVALID_TRANSITION
            detail: An incident in status CLOSED cannot change to IN_PROGRESS.
            instance: /api/v1/incidents/3f1c2a9e-7b4d-4c1a-9e2f-5d6b7a8c9d0e/acceptance
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    UnprocessableEntity:
      description: >-
        The request is well formed but its data does not pass validation. `errors` lists every
        invalid field, so a form can show them all at once.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: VALIDATION_FAILED
            detail: The request has 2 invalid fields.
            instance: /api/v1/incidents
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            errors:
              - field: title
                message: must not be blank
              - field: location.latitude
                message: must be between -90 and 90

    TooManyRequests:
      description: Too many attempts in a short time. `Retry-After` says when to try again.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Too Many Requests
            status: 429
            code: TOO_MANY_ATTEMPTS
            detail: Too many attempts. Try again later.
            instance: /api/v1/sessions
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    InternalServerError:
      description: Unexpected error. The body never reveals internal details; use `traceId`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred.
            instance: /api/v1/incidents
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
